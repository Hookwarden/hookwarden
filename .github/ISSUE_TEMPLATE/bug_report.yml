name: Bug report
description: A crash, a wrong verdict, or unexpected CLI behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here — see [SECURITY.md](https://github.com/Hookwarden/hookwarden/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: hookwarden version
      description: Output of `hookwarden --version`
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of bug?
      options:
        - Wrong verdict (false positive — flagged correct code)
        - Wrong verdict (false negative — missed a real bug)
        - Crash / parse error
        - CLI / output / exit code
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal handler that reproduces it
      description: The smallest webhook-handler snippet (and the command you ran) that shows the problem. Redact secrets.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Language / framework / provider
      description: e.g. TypeScript · Express · Stripe
