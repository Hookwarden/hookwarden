name: Release
on:
  workflow_run:
    workflows: [release-binaries]
    types: [completed]
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/*/package.json"
      - ".changeset/**"
      - ".github/workflows/release.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # PR-time preflight — validates build + tarball shape without publishing.
  # No npm auth needed: --dry-run skips registry interaction; OIDC happens
  # at real-publish time on the workflow_run leg (release job below).
  preflight:
    if: github.event_name == 'pull_request'
    name: Release preflight (build + dry-run pack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # Root `pnpm build` = `tsc --build` then emits the @hookwarden/mcp
        # dist/build-manifest.json (MCP-04). The published tarball still gets
        # a fresh manifest via the package's own prepack at publish time.
        run: pnpm build
      - name: Compliance coverage regression gate (Plan 25-04 COMPLIANCE-01)
        # D-03 / OQ#4 ratchet — FAILS the release if any compliance framework's
        # mapped-rule count dropped below packages/rules/compliance-coverage-baseline.json.
        # The baseline is bumped (committed) in the same PR that adds mappings,
        # so coverage can only ever rise. Mirrors the block-release discipline of
        # the bundle-inspection gates below. Requires the tsc build above (reads
        # @hookwarden/rules dist).
        run: pnpm --filter @hookwarden/rules compliance-coverage
      - name: Bundle inspection (pre-publish gate)
        run: pnpm inspect-bundle
      - name: Bundle inspection — @hookwarden/mcp (pre-publish gate, Plan 23-04)
        # SC#4 zero-outbound-TCP gate for the MCP server. Source-file regex
        # scan + package.json#dependencies allowlist + tarball structural
        # assertions (wasm + build-manifest + LICENSE + server.json).
        run: pnpm --filter @hookwarden/mcp inspect-bundle
      - name: Dry-run publish every workspace package
        # Validates each package's tarball + publishConfig without uploading.
        # No auth: --dry-run skips the registry PUT.
        run: pnpm -r publish --dry-run --no-git-checks --access public

  release:
    # Run on PR validation OR on successful release-binaries completion
    # (DC-17 producer/consumer chain). Skips on workflow_run with a
    # non-success conclusion (failure, cancelled, skipped).
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # OIDC: required for npm Trusted Publishers. The runtime issues a short-lived
      # JWT that npm verifies against the trust binding configured at npmjs.com.
      # Replaces NPM_TOKEN; provenance is automatically attached.
      id-token: write
    env:
      # Skip the simple-git-hooks pre-push hook in CI. The hook runs `pnpm preflight`
      # which spawns vitest; `pnpm changeset publish` does multiple `git push origin
      # <tag>` calls (one per published package) and the resulting concurrent vitest
      # runs race on `inspect-bundle.test.ts`'s in-place package.json mutations
      # (`withPkgEdit`). Pre-push hooks are a local-dev guard against pushing broken
      # code; CI already ran the same checks in the dedicated `CI` workflow + the
      # `Build` and `Bundle inspection` steps above this changesets/action step.
      SKIP_SIMPLE_GIT_HOOKS: '1'
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.publishedPackages }}
      version: ${{ steps.version.outputs.version }}
      homebrew-sha: ${{ steps.bump-homebrew.outputs.sha }}
      scoop-sha: ${{ steps.bump-scoop.outputs.sha }}
      action-sha: ${{ steps.bump-action.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # Root `pnpm build` = `tsc --build` then emits the @hookwarden/mcp
        # dist/build-manifest.json (MCP-04). The published tarball still gets
        # a fresh manifest via the package's own prepack at publish time.
        run: pnpm build
      - name: Compliance coverage regression gate (Plan 25-04 COMPLIANCE-01)
        # D-03 / OQ#4 ratchet — FAILS the release if any compliance framework's
        # mapped-rule count dropped below packages/rules/compliance-coverage-baseline.json.
        # The baseline is bumped (committed) in the same PR that adds mappings,
        # so coverage can only ever rise. Mirrors the block-release discipline of
        # the bundle-inspection gates below. Requires the tsc build above (reads
        # @hookwarden/rules dist).
        run: pnpm --filter @hookwarden/rules compliance-coverage
      - name: Bundle inspection (pre-publish gate)
        run: pnpm inspect-bundle
      - name: Bundle inspection — @hookwarden/mcp (pre-publish gate, Plan 23-04)
        # SC#4 zero-outbound-TCP gate for the MCP server. Source-file regex
        # scan + package.json#dependencies allowlist + tarball structural
        # assertions (wasm + build-manifest + LICENSE + server.json).
        run: pnpm --filter @hookwarden/mcp inspect-bundle
      - name: Upgrade npm for OIDC support
        # npm 11.5.1+ is required for native OIDC Trusted Publisher publishing.
        # Node 22 LTS ships with npm 10.x. Self-upgrade via `npm install -g
        # npm@latest` is known-flaky (npm 10 → 11 self-replacement can hit
        # MODULE_NOT_FOUND for `promise-retry`); pinning to a specific version
        # is the reliable path. Gated to non-PR — PR validation doesn't publish.
        if: github.event_name != 'pull_request'
        run: npm install -g npm@11.5.1
      - id: changesets
        # Skip on PR events — changesets/action expects to run on a real branch
        # (main) so it can open/update the Version Packages PR with `base: main`.
        # On PR contexts github.ref is `refs/pull/N/merge`, which the action
        # tries to use as the PR base and gets 422'd by the GitHub API. The
        # release-binaries → release.yml workflow_run chain handles publication
        # on tag push; PR-time only needs Build + Bundle inspection (above).
        if: github.event_name != 'pull_request'
        uses: changesets/action@v2
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm auth: OIDC via id-token: write (above) + Trusted Publisher
          # bindings on npmjs.com for `hookwarden`, `@hookwarden/engine`,
          # `@hookwarden/rules`, `@hookwarden/mcp` (v0.8.0+). npm 11.5+
          # auto-detects the OIDC env and exchanges the JWT for a short-lived
          # publish token — no NPM_TOKEN secret to rotate, immune to
          # package-side 2FA-policy changes (bug 8 from issue #12, which
          # forced multiple v0.3.1 re-runs).

      - name: Verify @hookwarden/mcp installability (Plan 23-08 — pipeline-green != published)
        # Per [[project_release_pipeline_fix_pkg_blocker]] — pipeline-green is
        # NOT proof the tarball is actually fetchable. Confirm with a real
        # registry-touching dry-run install AFTER the changesets publish step
        # claims success. Gated on the @hookwarden/mcp publish actually
        # happening in this release.
        if: |
          steps.changesets.outputs.published == 'true' &&
          contains(steps.changesets.outputs.publishedPackages, '@hookwarden/mcp')
        run: |
          # npm CDN propagation race — the publish endpoint and the read CDN
          # are different layers; the read side can lag 30-90s after
          # `changeset publish` returns 200. A flat `sleep 30` hit
          # "Cannot read properties of null (reading 'matches')" on v0.7.2
          # because the tarball metadata wasn't visible yet. Poll for the
          # exact just-published version for up to ~90s.
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@hookwarden/mcp") | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract @hookwarden/mcp version from publishedPackages output"
            exit 1
          fi
          echo "Waiting for @hookwarden/mcp@$VERSION to be queryable on npm..."
          for attempt in 1 2 3 4 5 6 7 8 9; do
            FOUND=$(npm view "@hookwarden/mcp@$VERSION" version 2>/dev/null || true)
            if [ "$FOUND" = "$VERSION" ]; then
              echo "Visible after ${attempt} attempt(s) (~$((attempt * 10))s)"
              break
            fi
            echo "Attempt $attempt: not yet visible (got '$FOUND'); sleeping 10s"
            sleep 10
          done
          # `npm install --dry-run` hits an upstream npm bug:
          # "Cannot read properties of null (reading 'matches')" — failed
          # on v0.7.2 and v0.7.3 despite the package being fully installable
          # in real environments (verified via `npm i -g @hookwarden/mcp@X.Y.Z`
          # in clean docker each time). `npm pack --dry-run` exercises the
          # tarball-fetch path without invoking the install-time resolver,
          # giving us the same "is this really published?" gate without the
          # false negative.
          npm pack --dry-run "@hookwarden/mcp@$VERSION"

      - name: Verify @hookwarden/canonical-json installability (Plan 25-01 — pipeline-green != published)
        # Mirror of the @hookwarden/mcp lane above. canonical-json is an
        # independently-versioned Apache-2.0 package (NOT in the Changesets
        # `fixed` group), published by the shared `pnpm changeset publish`
        # step once it is non-private. Per [[project_release_pipeline_fix_pkg_blocker]]
        # every new package needs its OWN OIDC Trusted Publisher binding on
        # npmjs.com (one-time, registered before first publish) — without it
        # the publish 404s and downstream consumers (api/worker/verifier +
        # Plan 02 MCP tool) become uninstallable even though earlier steps
        # went green. This step confirms the tarball is actually fetchable
        # AFTER changesets claims success, gated on canonical-json appearing
        # in the published set.
        if: |
          steps.changesets.outputs.published == 'true' &&
          contains(steps.changesets.outputs.publishedPackages, '@hookwarden/canonical-json')
        run: |
          # npm CDN propagation race — the read CDN can lag 30-90s after
          # `changeset publish` returns 200. Poll for the exact just-published
          # version for up to ~90s before the tarball-fetch assertion.
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name=="@hookwarden/canonical-json") | .version')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract @hookwarden/canonical-json version from publishedPackages output"
            exit 1
          fi
          echo "Waiting for @hookwarden/canonical-json@$VERSION to be queryable on npm..."
          for attempt in 1 2 3 4 5 6 7 8 9; do
            FOUND=$(npm view "@hookwarden/canonical-json@$VERSION" version 2>/dev/null || true)
            if [ "$FOUND" = "$VERSION" ]; then
              echo "Visible after ${attempt} attempt(s) (~$((attempt * 10))s)"
              break
            fi
            echo "Attempt $attempt: not yet visible (got '$FOUND'); sleeping 10s"
            sleep 10
          done
          # `npm pack --dry-run` exercises the tarball-fetch path without the
          # install-time resolver (which hits an upstream npm null-deref bug),
          # giving the same "is this really published?" gate without the false
          # negative — same rationale as the @hookwarden/mcp lane above.
          npm pack --dry-run "@hookwarden/canonical-json@$VERSION"

      - name: Install mcp-publisher CLI (Plan 23-09 — pinned to MCP_PUBLISHER_VERSION)
        # WARNING #4 fix: pinned to a specific GitHub Release tag, NEVER
        # `releases/latest`. Resolves at edit-time via
        # `gh api repos/modelcontextprotocol/registry/releases --jq '.[0].tag_name'`
        # (2026-05-30 resolved to v1.7.9). An upstream breaking change in
        # mcp-publisher can't silently break the hookwarden release pipeline;
        # bumping the pin is a deliberate PR.
        if: |
          steps.changesets.outputs.published == 'true' &&
          contains(steps.changesets.outputs.publishedPackages, '@hookwarden/mcp')
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Register @hookwarden/mcp at registry.modelcontextprotocol.io (Plan 23-09)
        # DISABLED 2026-05-30 — Plan 23-09 Tasks 2-5 pending.
        #
        # The commented-out commands below use `mcp-publisher login github`,
        # which is INTERACTIVE device-code auth (prints "Go to github.com/
        # login/device, enter code XXXX-XXXX"), NOT OIDC despite the original
        # comment claim. In CI this sits 15min waiting for a human and times
        # out, failing the whole Release workflow on every tag push.
        #
        # Re-enable once non-interactive auth is wired (DCR client credentials,
        # pre-issued bearer token, or upstream adds an OIDC path). Restore the
        # commands and remove the `echo`/exit-0 stub below.
        #
        # Plan 23-09 references:
        #   - Tasks 2-5 in .planning/phases/23-hookwarden-mcp-developer-preview-scan-handler/
        #   - SUMMARY at commit 7a84b8b notes "Tasks 0+1 done, 2-5 pending publish"
        #
        # Supersedes D-23-15 per RESEARCH §Pitfall 2: NO PRs to fictional
        # catalog repos. Cursor Directory + Continue Hub both scrape this
        # registry on nightly schedule; aggregator visibility lags 24-48h
        # (Plan 23-09 Tasks 2 + 3 human-verify).
        if: |
          steps.changesets.outputs.published == 'true' &&
          contains(steps.changesets.outputs.publishedPackages, '@hookwarden/mcp')
        working-directory: packages/mcp
        run: |
          echo "::warning::MCP registry publish skipped — Plan 23-09 Tasks 2-5 pending non-interactive auth."
          echo "The mcp-publisher CLI requires interactive device-code login; CI cannot complete it."
          echo "Restore the commands below once non-interactive auth is wired."
          # mcp-publisher login github
          # mcp-publisher publish --dry-run
          # mcp-publisher publish

      # ----- Phase 4.1 channel fan-out (only when the `hookwarden` CLI was published) -----
      #
      # Original gate: all downstream steps fired whenever Changesets published anything.
      # That broke for npm-only scoped publishes (e.g. @hookwarden/pr-renderer@1.0.0, Phase 8):
      # the "Wait for PyPI publish" step would resolve `version` from the wrong package and
      # poll for a PyPI release that never fires (release-py.yml is CLI-only). Likewise the
      # Homebrew/Scoop/hookwarden-action bumps and channel-parity gate are CLI-distribution
      # concerns that have no meaning for `@hookwarden/*` library publishes.
      #
      # New gate: detect whether `hookwarden` (the unscoped CLI package, npm+PyPI dual-
      # publish) is in the published set. Only then run the CLI fan-out.

      - name: Detect whether hookwarden CLI was published
        id: cli-published
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          if echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -e 'any(.name == "hookwarden")' > /dev/null; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "hookwarden CLI included in this publish — running CLI distribution fan-out"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
            published=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r 'map(.name + "@" + .version) | join(", ")')
            echo "::notice::Skipping PyPI wait + Homebrew/Scoop/hookwarden-action bumps + channel-parity gate — published set is library-only: ${published}"
          fi

      - name: Resolve version (drop leading v)
        id: version
        if: steps.cli-published.outputs.cli == 'true'
        run: |
          # changesets publishedPackages is a JSON array of {name, version}.
          # The `hookwarden` CLI (unscoped) is the canonical version source for the
          # distribution channels — pick its version explicitly, not the array's first
          # element (which is order-dependent and can be a scoped lib like
          # @hookwarden/pr-renderer when CLI+lib publish in the same Changesets run).
          version=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "hookwarden") | .version')
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: v${version}"

      # Installability gate (issue #12). `changeset publish` can publish the CLI while a scoped
      # @hookwarden/* dependency silently fails (e.g. missing OIDC Trusted Publisher binding),
      # leaving `npm i hookwarden` broken even though earlier steps went green — exactly what
      # happened in 0.5.2/0.5.3. This resolves the full dependency tree from the public registry
      # and fails the release loudly (before the brew/scoop/winget fan-out points at it).
      - name: Verify the published release is installable from npm
        if: steps.cli-published.outputs.cli == 'true'
        run: node scripts/verify-npm-installable.mjs "${{ steps.version.outputs.version }}"

      - name: Wait for PyPI publish workflow (release-py.yml triggered by the tag push)
        if: steps.cli-published.outputs.cli == 'true' && !contains(steps.version.outputs.version, '-beta')
        run: |
          # Changesets pushes the tag; release-py.yml runs on tag. Poll until it completes.
          # B2 FIX: GHA `gh run list --json headBranch` for tag-triggered runs may return
          # either `v1.2.3` (bare tag) or `refs/tags/v1.2.3` (full ref). Strip a leading
          # `refs/tags/` prefix in the jq filter so both forms match. Without normalization
          # the loop exhausts 60 × 10s = 10 minutes and hard-fails every release.
          set -euo pipefail
          tag="${{ steps.version.outputs.version }}"
          echo "Waiting for release-py.yml run on tag $tag..."
          for i in {1..60}; do
            status=$(gh run list --repo Hookwarden/hookwarden --workflow=release-py.yml \
                       --json status,conclusion,headBranch,event,displayTitle --jq \
                       "map(select((.headBranch // \"\" | sub(\"^refs/tags/\"; \"\")) == \"$tag\")) | .[0]" || echo "")
            if [[ -z "$status" || "$status" == "null" ]]; then sleep 10; continue; fi
            conclusion=$(echo "$status" | jq -r .conclusion)
            run_status=$(echo "$status" | jq -r .status)
            if [[ "$run_status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "PyPI publish succeeded for $tag"
                exit 0
              else
                echo "PyPI publish FAILED for $tag (conclusion=$conclusion)"
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for release-py.yml on $tag"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub App token (homebrew-tap + scoop-bucket + hookwarden-action)
        id: app-token
        if: steps.cli-published.outputs.cli == 'true' && !contains(steps.version.outputs.version, '-beta')
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOOKWARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.HOOKWARDEN_BOT_APP_PRIVATE_KEY }}
          owner: Hookwarden
          repositories: |
            homebrew-tap
            scoop-bucket
            hookwarden-action

      - name: Bump Homebrew formula
        id: bump-homebrew
        if: steps.cli-published.outputs.cli == 'true' && !contains(steps.version.outputs.version, '-beta')
        run: |
          set -euo pipefail
          # tail -n1: defends against stray stdout from the script's git invocations
          # (newer git can leak tag-update notices despite -q). `git rev-parse HEAD`
          # is always the script's last line, so the SHA is reliably the tail.
          sha=$(scripts/release/bump-homebrew.sh | tail -n1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Bump Scoop manifest
        id: bump-scoop
        if: steps.cli-published.outputs.cli == 'true' && !contains(steps.version.outputs.version, '-beta')
        run: |
          set -euo pipefail
          sha=$(scripts/release/bump-scoop.sh | tail -n1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build + bump hookwarden-action
        id: bump-action
        if: steps.cli-published.outputs.cli == 'true' && !contains(steps.version.outputs.version, '-beta')
        run: |
          set -euo pipefail
          # D-79: ncc bundles src/index.ts + workspace `hookwarden` dep + @actions/* runtime deps
          # into dist/index.js. The bundle inlines transitive supply-chain — Phase 1's
          # bundle-inspection gate (`pnpm inspect-bundle` earlier in this workflow) is the
          # integrity check.
          # WARNING 5 reconciliation: invoke the canonical `bundle` npm script (defined in
          # packages/github-action/package.json by Plan 05-01) — single source of truth.
          # Local devs run `pnpm --filter @hookwarden/github-action run bundle`; CI runs the
          # exact same command. No drift between local and CI bundle invocations.
          # Note: action-sha is intentionally NOT fed into the channel-parity gate below;
          # the parity gate enforces SHA lockstep across binary channels (PyPI shim /
          # Homebrew / Scoop). The JS Action's bundled CLI inherits the same npm version
          # via the workspace dep, so it is trivially in lockstep — no separate gate needed.
          pnpm --filter @hookwarden/github-action run bundle
          sha=$(scripts/release/bump-hookwarden-action.sh | tail -n1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Channel-parity SHA gate
        if: steps.cli-published.outputs.cli == 'true' && !contains(steps.version.outputs.version, '-beta')
        run: bash scripts/release/verify-channel-parity.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOMEBREW_SHA: ${{ steps.bump-homebrew.outputs.sha }}
          SCOOP_SHA: ${{ steps.bump-scoop.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
