name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec tsc --build
      - name: Bundle inspection (pre-publish gate)
        run: pnpm inspect-bundle
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token auth is a temporary bootstrap path: npm Trusted Publishers
          # is unavailable on this account tier. NPM_TOKEN is the env name
          # changesets/action looks for to force token auth (NODE_AUTH_TOKEN
          # alone leaves OIDC active and forces provenance, which the registry
          # rejects on private repos). After Plan 08 flips repo to public,
          # migrate to per-package OIDC trusted publishers and revoke NPM_TOKEN.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node writes a project-level .npmrc that interpolates
          # ${NODE_AUTH_TOKEN}; without this var the .npmrc resolves to
          # empty and PUT /registry returns 404 (npm masks no-auth as 404).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
