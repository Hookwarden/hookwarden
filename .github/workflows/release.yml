name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  # OIDC: required for npm Trusted Publishers. The runtime issues a short-lived
  # JWT that npm verifies against the trust binding configured at npmjs.com.
  # Replaces NPM_TOKEN; provenance is automatically attached.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec tsc --build
      - name: Bundle inspection (pre-publish gate)
        run: pnpm inspect-bundle
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic npm token used as the auth source for `pnpm changeset publish`.
          # Trusted Publishing (OIDC) is still wired up on the workflow side via
          # `permissions.id-token: write` above, so npm provenance attestation is
          # attached when publishing — best-of-both: classic auth + signed provenance.
          # Remove this once Trusted Publisher entries exist on npmjs.com for
          # `hookwarden`, `@hookwarden/engine`, `@hookwarden/rules` and pure OIDC works.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
