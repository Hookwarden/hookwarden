name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec tsc --build
      - name: Bundle inspection (pre-publish gate)
        run: pnpm inspect-bundle
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token auth is a temporary bootstrap path: npm Trusted Publishers
          # is unavailable on this account tier. Migrate to per-package OIDC
          # trusted publishers after first publish; revoke NPM_TOKEN at that point.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance disabled for v0.0.1 — npm provenance requires the source
          # repo to be PUBLIC at publish time, but the repo stays PRIVATE through
          # defensive registration (Plan 08 flips to public). Re-enable after
          # Plan 08; v0.0.2+ publishes will have provenance attestation.
          NPM_CONFIG_PROVENANCE: "false"
