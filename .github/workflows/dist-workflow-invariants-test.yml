name: DIST workflow invariants test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-binaries.yml'
      - 'scripts/release/test-workflow-invariants.sh'
      - '.github/workflows/dist-workflow-invariants-test.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-binaries.yml'
      - 'scripts/release/test-workflow-invariants.sh'
      - '.github/workflows/dist-workflow-invariants-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run release workflow invariants test
        run: bash scripts/release/test-workflow-invariants.sh
