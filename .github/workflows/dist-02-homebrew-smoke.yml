name: DIST-02 Homebrew smoke
on:
  workflow_dispatch:
  schedule:
    # Re-run weekly to catch upstream Homebrew breakage independent of releases.
    - cron: '0 12 * * 1'
  workflow_run:
    workflows: ["Release", "Release bumps (manual recovery)"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    # Cross-workflow sync: only fire from a successful Release run (or any
    # non-workflow_run trigger like schedule / dispatch). DC-18 removed the
    # pre-launch gate (Plan 04.2-08) now that binaries ship.
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name != 'workflow_run'
    # macOS targets deferred (Apple Developer Program enrollment unfunded).
    # The formula uses `depends_on :linux` so macOS installs error cleanly;
    # smoke matrix is Linux-only until macOS bottles ship.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Homebrew on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: brew install + version smoke
        run: |
          set -euo pipefail
          # Homebrew 6 Tap Trust (https://docs.brew.sh/Tap-Trust): `brew tap` + a short-name
          # install is refused for an untrusted tap; a fully qualified install trusts just this
          # formula. Same command the README tells users to run.
          brew install Hookwarden/tap/hookwarden
          INSTALLED_VERSION=$(hookwarden --version | head -1)
          FORMULA_VERSION=$(brew info --json=v2 Hookwarden/tap/hookwarden | jq -r '.formulae[0].versions.stable')
          echo "Installed: $INSTALLED_VERSION"
          echo "Formula:   $FORMULA_VERSION"
          # DIST-02 success criterion: formula version MUST appear in binary --version output
          echo "$INSTALLED_VERSION" | grep -q "$FORMULA_VERSION"
