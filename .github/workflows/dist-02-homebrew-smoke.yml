name: DIST-02 Homebrew smoke
on:
  workflow_dispatch:
  schedule:
    # Re-run weekly to catch upstream Homebrew breakage independent of releases.
    - cron: '0 12 * * 1'
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    # Gated off until Phase 4.x ships real binaries + checksums.txt (A-04.1-03-004).
    # Set the `PHASE_4X_BINARIES_SHIPPED` repo variable to `true` once binaries land
    # to activate this matrix; same flag controls dist-01 + dist-03 so a single flip
    # turns on the full smoke surface.
    if: |
      vars.PHASE_4X_BINARIES_SHIPPED == 'true' && (
        github.event.workflow_run.conclusion == 'success' ||
        github.event_name != 'workflow_run'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Homebrew on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: brew tap + install + version smoke
        run: |
          set -euo pipefail
          brew tap Hookwarden/tap
          brew install hookwarden
          INSTALLED_VERSION=$(hookwarden --version | head -1)
          FORMULA_VERSION=$(brew info --json=v2 hookwarden | jq -r '.formulae[0].versions.stable')
          echo "Installed: $INSTALLED_VERSION"
          echo "Formula:   $FORMULA_VERSION"
          # DIST-02 success criterion: formula version MUST appear in binary --version output
          echo "$INSTALLED_VERSION" | grep -q "$FORMULA_VERSION"
