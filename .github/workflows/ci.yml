name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm exec biome ci .
      - name: Engine purity (dependency-cruiser)
        run: pnpm purity
      - name: Build (tsc -b)
        run: pnpm exec tsc --build
      - name: Test (vitest)
        run: pnpm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python shim test deps
        run: pip install -e 'python-packages/hookwarden[dev]'
      - name: Test (pytest, Python shim)
        run: pytest python-packages/hookwarden -x
      - name: Bundle inspection (CLI)
        run: pnpm inspect-bundle

  dist-01-precommit-fixture:
    name: DIST-01 pre-commit hook fixture
    # See .planning/phases/04.1-adoption-channels/04.1-02-precommit-hooks-yaml-PLAN.md.
    # Gated on `PHASE_4X_BINARIES_SHIPPED`: this fixture exercises the full
    # pre-commit → PyPI shim → SHA-pinned binary download chain, which only
    # works AFTER the first successful v0.3.0 tag-push (release-binaries.yml's
    # aggregate job flips the variable + release-py.yml stamps checksums.json
    # against the just-uploaded binary SHAs). DC-18 removed the gate prematurely
    # in Plan 04.2-08; counter-corrected here. The `continue-on-error: true`
    # waiver stays REMOVED — once the gate flips, failures should be loud.
    if: ${{ vars.PHASE_4X_BINARIES_SHIPPED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install pre-commit

      - name: Materialize fixture config (substitute REPO_ROOT_PLACEHOLDER)
        shell: bash
        working-directory: test/fixtures/precommit
        run: |
          REPO_ROOT="$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)"
          sed -i.bak "s|REPO_ROOT_PLACEHOLDER|$REPO_ROOT|" .pre-commit-config.yaml
          rm -f .pre-commit-config.yaml.bak
          cat .pre-commit-config.yaml

      - name: Initialize fixture as a temp git repo (pre-commit requires a git repo)
        shell: bash
        working-directory: test/fixtures/precommit
        run: |
          git init --quiet
          git -c user.email=ci@example.com -c user.name=CI add .
          git -c user.email=ci@example.com -c user.name=CI commit --quiet -m "fixture initial"

      - name: Run pre-commit (expect non-zero — fixture has a not-verified Stripe handler)
        id: precommit
        shell: bash
        working-directory: test/fixtures/precommit
        run: |
          set +e
          pre-commit run --all-files | tee /tmp/precommit.log
          code=${PIPESTATUS[0]}
          echo "precommit-exit=$code" >> "$GITHUB_OUTPUT"
          # We expect a non-zero exit. Exit 0 from this step is the failure mode.
          if [[ "$code" == "0" ]]; then
            echo "ERROR: pre-commit exited 0; expected non-zero (Stripe fixture should be flagged)" >&2
            exit 1
          fi
          # Assert finding output mentions the fixture file (proves the hook ran the binary).
          if ! grep -q "stripe-not-verified" /tmp/precommit.log; then
            echo "ERROR: pre-commit output did not mention stripe-not-verified.ts" >&2
            cat /tmp/precommit.log >&2
            exit 1
          fi
          # Assert pre-commit successfully installed the shim (Step F / B4 fix verification).
          if grep -qE "InstallationError|Installing environment for .* failed" /tmp/precommit.log; then
            echo "ERROR: pre-commit failed to install the hookwarden shim — Step F (B4 fix) regression" >&2
            cat /tmp/precommit.log >&2
            exit 1
          fi
          echo "OK: pre-commit correctly reported the fixture's not-verified Stripe handler"
