name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm exec biome ci .
      - name: Engine purity (dependency-cruiser)
        run: pnpm purity
      - name: Build (tsc -b)
        run: pnpm exec tsc --build
      - name: Test (vitest)
        run: pnpm test
      - name: Bundle inspection (CLI)
        run: pnpm inspect-bundle
