name: release-binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch or tag) for non-tag dry-run"
        required: false
        default: "main"

concurrency: ${{ github.workflow }}-${{ github.ref }}

# OIDC permissions — extends Phase 4.1 DC-09 to DC-14 (Azure Trusted Signing
# federated identity in 04.2-05). `contents: write` enables the eventual
# `gh release upload` step (04.2-07). `pull-requests: write` is intentionally
# NOT granted — this workflow only produces release assets.
permissions:
  contents: write
  id-token: write

# Gate Authenticode signing on the Trusted Signing identity actually existing.
# Microsoft's identity-validation queue can sit for weeks; without this gate,
# an unvalidated tenant fails the whole Windows job. Remove the gate (and the
# unsigned-fallback smoke step below) once TRUSTED_SIGNING_ACCOUNT_NAME is a
# permanent repo secret and we never intend to ship unsigned Windows .exes.
env:
  SIGN_ENABLED: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME != '' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # macOS legs dropped from v0.3.0 — Apple Developer Program enrollment
        # is unfunded; Plan 04.2-04 deferred-in-place. Restore the two macOS
        # entries (macos-latest arm64 + macos-13 x64) when funding lands.
        include:
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64,  asset: hookwarden-linux-arm64,     arch: arm64 }
          - { os: ubuntu-latest,    target: bun-linux-x64,     asset: hookwarden-linux-x64,       arch: x64   }
          - { os: windows-latest,   target: bun-windows-x64,   asset: hookwarden-windows-x64.exe, arch: x64   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          # `latest` while we discover a Windows-stable version. Bun 1.1.34
          # has a Windows --compile bug ("Expected pretty file path to have
          # only forward slashes") on backslash-separated module paths.
          # Once a green Windows build identifies a working version, pin it
          # tightly per CLAUDE.md "verify version pin" discipline AND bump
          # the workspace `package.json#packageManager` (or add a bun-version
          # file) to match.
          bun-version: latest

      - name: Cache Bun install store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Sync generated assets (WASM + version constants + rule bundle)
        run: |
          # All sync scripts run in `prepare` (post pnpm install) but we re-run
          # defensively — all generated files must exist before tsc compiles,
          # and `prepare` can be skipped under some pnpm configurations on CI.
          node packages/cli/scripts/sync-wasm.mjs
          node packages/cli/scripts/sync-version.mjs
          node packages/engine/scripts/sync-version.mjs
          node packages/rules/scripts/sync-version.mjs
          node packages/rules/scripts/sync-bundle.mjs

      - name: Build CLI (TS → JS)
        run: pnpm build

      - name: Compile standalone binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          # Entry path matches the verified `dist/` layout recorded in
          # `.planning/phases/04.2-binary-distribution/04.2-CONTEXT.md
          # §"Build-output snapshot"` (W5 fix from checker iteration 1).
          # The CLI's package.json#bin points at ./bin/cli.cjs which dynamic-
          # imports ../dist/index.js; for Bun --compile we point directly at
          # the ESM entry (no shim needed — Bun handles ESM natively).
          ENTRY="packages/cli/dist/index.js"
          if [[ ! -f "$ENTRY" ]]; then
            echo "ERROR: CLI entry $ENTRY not found — adjust release-binaries.yml#build step or fix the build above" >&2
            echo "Cross-check 04.2-CONTEXT.md §'Build-output snapshot' for the recorded dist/ layout (W5 fix)" >&2
            ls -la packages/cli/dist >&2 || true
            exit 1
          fi
          bun build "$ENTRY" --compile --target="$TARGET" --outfile="$ASSET"
          ls -la "$ASSET"

      - name: Azure login via OIDC federated identity (Windows)
        if: matrix.os == 'windows-latest' && env.SIGN_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign binary via Azure Trusted Signing (Windows)
        if: matrix.os == 'windows-latest' && env.SIGN_ENABLED == 'true'
        uses: azure/trusted-signing-action@v2.0.0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature (Windows)
        if: matrix.os == 'windows-latest' && env.SIGN_ENABLED == 'true'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "$env:ASSET"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Signature status: $($sig.Status); StatusMessage: $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "Signature Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          # Locate signtool from any installed Windows 10/11 SDK on the runner.
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
                      -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found on runner"
            exit 1
          }
          # /pa = Default Authentication Verification Policy (Authenticode); /v = verbose
          & $signtool verify /pa /v "$env:ASSET"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool verify failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          # Confirm the signed binary still executes.
          & ".\$env:ASSET" --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signed binary failed to execute --version (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }

      - name: Per-target smoke + binary forbidden-deps scan (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # 1. --version sanity. For tag-push: must contain the tag minus the leading 'v'.
          # For workflow_dispatch dry-runs: just assert non-empty.
          chmod +x "./$ASSET"
          VERSION_OUT="$(./$ASSET --version 2>&1)"
          echo "Binary --version: $VERSION_OUT"
          if [[ -z "$VERSION_OUT" ]]; then
            echo "ERROR: --version returned empty output" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
            if ! echo "$VERSION_OUT" | grep -qF "$EXPECTED"; then
              echo "ERROR: --version output '$VERSION_OUT' does not contain expected version '$EXPECTED' (from tag $GITHUB_REF_NAME)" >&2
              exit 1
            fi
          fi

          # 2. scan against the release-smoke fixture corpus.
          # Phase 4 CLI-04 default --fail-on threshold is 'high'. Both
          # not-verified fixtures are at critical severity, so exit code MUST
          # be non-zero (1 = findings at/above threshold). Exit codes >=2 are
          # engine/config/parse errors — smoke failures, not expected outcomes.
          set +e
          ./$ASSET scan packages/cli/test/fixtures/release-smoke/ > /tmp/scan-out.txt 2>&1
          SCAN_EXIT=$?
          set -e
          cat /tmp/scan-out.txt
          if [[ "$SCAN_EXIT" -eq 0 ]]; then
            echo "ERROR: scan against release-smoke fixture exited 0; expected non-zero (Phase 4 CLI-04 — not-verified findings at/above 'high' threshold)" >&2
            exit 1
          fi
          if [[ "$SCAN_EXIT" -ge 2 ]]; then
            echo "ERROR: scan exited with engine/config/parse error code $SCAN_EXIT; expected exit 1 (findings at/above threshold)" >&2
            exit 1
          fi
          # Both finding states must appear (proves both code paths execute end-to-end —
          # JS + Python fixtures, library-verified + not-verified rules).
          grep -q 'verified' /tmp/scan-out.txt || { echo "ERROR: scan output missing 'verified' state" >&2; exit 1; }
          grep -q 'not-verified' /tmp/scan-out.txt || { echo "ERROR: scan output missing 'not-verified' state" >&2; exit 1; }

          # 3. Binary-level forbidden-deps strings scan — DISABLED for Bun-compiled binaries.
          #
          # Originally introduced in 04.2-06 as DC-19 defense-in-depth on top of the
          # source-level inspect-bundle.ts gate (run in release.yml's PR-time preflight).
          # Discovered on the v0.3.0 release (2026-05-18): Bun's --target=bun-linux-*
          # compiled binaries embed (a) every package on Bun's "popular packages
          # needing build scripts" reference list (@sentry/profiling-node, @datadog/*,
          # @appsignal/nodejs, …) and (b) bundled-stdlib shim paths like
          # `tmp_modules/thirdparty/undici.ts`. `grep -F -f` against `strings` output
          # produces guaranteed false positives that no deny-list pruning can avoid
          # — the offending strings live inside Bun's runtime, not user code.
          #
          # The source-level inspect-bundle.ts gate remains authoritative: it parses
          # import-shape regexes (\brequire\(["']…|from\s+["']…) against the tarball-
          # bound dist/, where Bun's internal strings are absent.
          #
          # TODO(post-v0.3.0): rewrite as an import-shape pattern check against
          # bun-compiled output (e.g., compiled `__require("axios")` markers) and
          # re-enable.
          echo "OK: smoke (--version + scan + state-grep) passed for $ASSET; binary-strings scan disabled pending import-shape rewrite"

      - name: Per-target smoke + binary forbidden-deps scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:SIGN_ENABLED -ne 'true') {
            Write-Warning "Trusted Signing identity not provisioned (TRUSTED_SIGNING_ACCOUNT_NAME unset). Shipping unsigned Windows .exe — SmartScreen will warn on first run."
          }

          # 1. --version sanity.
          $versionOut = & ".\$env:ASSET" --version 2>&1 | Out-String
          Write-Host "Binary --version: $versionOut"
          if ([string]::IsNullOrWhiteSpace($versionOut)) {
            Write-Error "--version returned empty output"
            exit 1
          }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+') {
            $expected = $env:GITHUB_REF_NAME.TrimStart("v")
            if (-not $versionOut.Contains($expected)) {
              Write-Error "--version output '$versionOut' does not contain expected version '$expected' (from tag $env:GITHUB_REF_NAME)"
              exit 1
            }
          }

          # 2. scan against the release-smoke fixture corpus.
          $scanOut = & ".\$env:ASSET" scan packages/cli/test/fixtures/release-smoke/ 2>&1 | Out-String
          $scanExit = $LASTEXITCODE
          Write-Host $scanOut
          if ($scanExit -eq 0) {
            Write-Error "scan against release-smoke fixture exited 0; expected non-zero (Phase 4 CLI-04)"
            exit 1
          }
          if ($scanExit -ge 2) {
            Write-Error "scan exited with engine/config/parse error code $scanExit; expected exit 1"
            exit 1
          }
          if ($scanOut -notmatch 'verified') { Write-Error "scan output missing 'verified' state"; exit 1 }
          if ($scanOut -notmatch 'not-verified') { Write-Error "scan output missing 'not-verified' state"; exit 1 }

          # 3. Binary-level forbidden-deps strings scan — DISABLED on Bun-compiled
          # binaries; same false-positive issue as the Linux leg (see Linux step
          # comment for details). Source-level inspect-bundle.ts gate at PR time
          # remains authoritative.
          Write-Host "OK: smoke (--version + scan + state-grep) passed for $env:ASSET; binary-strings scan disabled pending import-shape rewrite"

          # Reset $LASTEXITCODE — the scan invocation above legitimately exits 1
          # (findings at threshold) and $LASTEXITCODE persists across pwsh
          # commands. Without this reset, the step exits with the scan's 1
          # despite Write-Host succeeding. The Linux bash variant avoids this
          # via `set +e` / explicit SCAN_EXIT capture.
          exit 0

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # Suffix encodes signing status so downstream release-upload steps
          # can pick the right asset without re-deriving it. Windows is -signed
          # only when Trusted Signing actually ran; Linux is always -unsigned
          # (no platform-mandated codesigning in v0.3.0). When 04.2-04 is
          # reactivated and macOS rejoins the matrix, extend this conditional
          # with `startsWith(matrix.os, 'macos')`.
          name: ${{ matrix.asset }}-${{ (matrix.os == 'windows-latest' && env.SIGN_ENABLED == 'true') && 'signed' || 'unsigned' }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: aggregate (checksums + release assets + variable flip)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all matrix artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          # Matches both -signed (Windows x64) and -unsigned (Linux arm64,
          # Linux x64) — Phase 4.2 v0.3.0 has no platform-mandated codesigning
          # for Linux. macOS legs absent — Plan 04.2-04 deferred per 2026-05-06.
          pattern: hookwarden-*

      - name: Stage binaries to workspace root
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Each artifact lands at ./artifacts/<artifact-name>/<filename>.
          # Stage every binary at the repo root so sha256sum produces the
          # exact filename consumers expect (no leading dirs).
          for d in ./artifacts/hookwarden-*; do
            for f in "$d"/*; do
              base="$(basename "$f")"
              cp "$f" "./$base"
            done
          done
          echo "Staged binaries:"
          ls -la hookwarden-* 2>/dev/null || { echo "ERROR: no binaries staged from artifacts" >&2; exit 1; }

          # Sanity: exactly the 3 expected filenames must be present (post-2026-05-06).
          for expected in hookwarden-linux-arm64 hookwarden-linux-x64 hookwarden-windows-x64.exe; do
            if [[ ! -f "$expected" ]]; then
              echo "ERROR: expected binary $expected missing after artifact staging" >&2
              ls -la hookwarden-* >&2 || true
              exit 1
            fi
          done

      - name: Generate checksums.txt (format-locked <sha>  <filename>)
        run: |
          set -euo pipefail
          # sha256sum produces lines in the exact format `<sha>  <filename>\n`
          # (two-space separator, lowercase 64-char hex). This is the FORMAT
          # LOCK contract for downstream consumers (bump-homebrew.sh,
          # bump-scoop.sh, stamp-checksums.py) — see Phase 4.2 PATTERNS.md.
          # macOS targets absent — Plan 04.2-04 deferred per 2026-05-06; restore
          # the two darwin entries here when Apple Developer enrollment lands.
          sha256sum \
            hookwarden-linux-arm64 \
            hookwarden-linux-x64 \
            hookwarden-windows-x64.exe \
            > checksums.txt
          echo "checksums.txt content:"
          cat checksums.txt

          # Hard-fail on any line that doesn't match <sha:64-hex>  <filename>.
          if ! awk 'NF != 2 || $1 !~ /^[a-f0-9]{64}$/ { exit 1 }' checksums.txt; then
            echo "ERROR: checksums.txt has lines that violate the format lock <sha:64-hex>  <filename>" >&2
            cat checksums.txt >&2
            exit 1
          fi

          # Hard-fail on any filename outside the narrowed v0.3.0 whitelist.
          if ! awk '$2 !~ /^hookwarden-(linux-(arm64|x64)|windows-x64\.exe)$/ { exit 1 }' checksums.txt; then
            echo "ERROR: checksums.txt has filenames outside the v0.3.0 whitelist (linux-arm64|linux-x64|windows-x64.exe)" >&2
            cat checksums.txt >&2
            exit 1
          fi

          # Hard-fail if any of the 3 expected filenames is missing.
          for expected in hookwarden-linux-arm64 hookwarden-linux-x64 hookwarden-windows-x64.exe; do
            if ! awk -v f="$expected" '$2 == f { found=1; exit } END { exit !found }' checksums.txt; then
              echo "ERROR: filename $expected missing from checksums.txt" >&2
              cat checksums.txt >&2
              exit 1
            fi
          done

      - name: Upload binaries + checksums.txt to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Defensive create-if-missing: in DC-17's chained model, this
          # aggregation job is the first publisher to the Release, so the
          # Release may not yet exist when we upload assets.
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Mark prerelease GH Releases (e.g. v0.8.0-beta) as prerelease so
            # downstream `release: published` consumers (WinGet) can skip them and
            # never bump the stable WinGet channel to a beta. Stable tags stay --latest.
            PRERELEASE_FLAG="--latest"
            case "$VERSION" in *-beta*|*-alpha*|*-rc*) PRERELEASE_FLAG="--prerelease" ;; esac
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              $PRERELEASE_FLAG \
              --generate-notes
          fi
          # --clobber: idempotent on partial-state reruns.
          gh release upload "$VERSION" \
            hookwarden-linux-arm64 \
            hookwarden-linux-x64 \
            hookwarden-windows-x64.exe \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Flip PHASE_4X_BINARIES_SHIPPED repo variable (idempotent, non-blocking)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # continue-on-error: GITHUB_TOKEN's default permissions do not include
        # `actions: write` for repo variables (HTTP 403 "Resource not accessible
        # by integration"). The HOOKWARDEN_BOT_APP token would have rights but
        # is intentionally NOT installed on this repo (least-privilege per
        # STATE.md). Flipping the variable activates dist-* smoke matrices in
        # CI — non-blocking to the release itself. If this step fails, flip
        # manually after the release lands:
        #
        #   gh variable set PHASE_4X_BINARIES_SHIPPED --body true \
        #     --repo Hookwarden/hookwarden
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh variable set PHASE_4X_BINARIES_SHIPPED \
            --body true \
            --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          echo "Aggregation job complete."
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "Tag (if any): ${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" != "push" || ! "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "NOTE: workflow_dispatch dry-run — Release upload + variable flip skipped."
          fi
