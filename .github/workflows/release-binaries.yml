name: release-binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch or tag) for non-tag dry-run"
        required: false
        default: "main"

concurrency: ${{ github.workflow }}-${{ github.ref }}

# OIDC permissions — extends Phase 4.1 DC-09 to DC-14 (Azure Trusted Signing
# federated identity in 04.2-05). `contents: write` enables the eventual
# `gh release upload` step (04.2-07). `pull-requests: write` is intentionally
# NOT granted — this workflow only produces release assets.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # macOS legs dropped from v0.3.0 — Apple Developer Program enrollment
        # is unfunded; Plan 04.2-04 deferred-in-place. Restore the two macOS
        # entries (macos-latest arm64 + macos-13 x64) when funding lands.
        include:
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64,  asset: hookwarden-linux-arm64,     arch: arm64 }
          - { os: ubuntu-latest,    target: bun-linux-x64,     asset: hookwarden-linux-x64,       arch: x64   }
          - { os: windows-latest,   target: bun-windows-x64,   asset: hookwarden-windows-x64.exe, arch: x64   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          # `latest` while we discover a Windows-stable version. Bun 1.1.34
          # has a Windows --compile bug ("Expected pretty file path to have
          # only forward slashes") on backslash-separated module paths.
          # Once a green Windows build identifies a working version, pin it
          # tightly per CLAUDE.md "verify version pin" discipline AND bump
          # the workspace `package.json#packageManager` (or add a bun-version
          # file) to match.
          bun-version: latest

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Sync generated assets (WASM + version constants + rule bundle)
        run: |
          # All sync scripts run in `prepare` (post pnpm install) but we re-run
          # defensively — all generated files must exist before tsc compiles,
          # and `prepare` can be skipped under some pnpm configurations on CI.
          node packages/cli/scripts/sync-wasm.mjs
          node packages/cli/scripts/sync-version.mjs
          node packages/rules/scripts/sync-version.mjs
          node packages/rules/scripts/sync-bundle.mjs

      - name: Build CLI (TS → JS)
        run: pnpm build

      - name: Compile standalone binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          # Entry path matches the verified `dist/` layout recorded in
          # `.planning/phases/04.2-binary-distribution/04.2-CONTEXT.md
          # §"Build-output snapshot"` (W5 fix from checker iteration 1).
          # The CLI's package.json#bin points at ./bin/cli.cjs which dynamic-
          # imports ../dist/index.js; for Bun --compile we point directly at
          # the ESM entry (no shim needed — Bun handles ESM natively).
          ENTRY="packages/cli/dist/index.js"
          if [[ ! -f "$ENTRY" ]]; then
            echo "ERROR: CLI entry $ENTRY not found — adjust release-binaries.yml#build step or fix the build above" >&2
            echo "Cross-check 04.2-CONTEXT.md §'Build-output snapshot' for the recorded dist/ layout (W5 fix)" >&2
            ls -la packages/cli/dist >&2 || true
            exit 1
          fi
          bun build "$ENTRY" --compile --target="$TARGET" --outfile="$ASSET"
          ls -la "$ASSET"

      - name: Azure login via OIDC federated identity (Windows)
        if: matrix.os == 'windows-latest'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign binary via Azure Trusted Signing (Windows)
        if: matrix.os == 'windows-latest'
        uses: azure/trusted-signing-action@v1.2.0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "$env:ASSET"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Signature status: $($sig.Status); StatusMessage: $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "Signature Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          # Locate signtool from any installed Windows 10/11 SDK on the runner.
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
                      -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found on runner"
            exit 1
          }
          # /pa = Default Authentication Verification Policy (Authenticode); /v = verbose
          & $signtool verify /pa /v "$env:ASSET"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool verify failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          # Confirm the signed binary still executes.
          & ".\$env:ASSET" --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signed binary failed to execute --version (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Windows: -signed (Authenticode via Trusted Signing above).
          # Linux:   -unsigned (no platform-mandated codesigning in v0.3.0).
          # When 04.2-04 is reactivated and macOS rejoins the matrix, extend
          # this conditional with `startsWith(matrix.os, 'macos')`.
          name: ${{ matrix.asset }}-${{ matrix.os == 'windows-latest' && 'signed' || 'unsigned' }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1
