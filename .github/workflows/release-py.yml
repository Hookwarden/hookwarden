name: Release (PyPI)
on:
  push:
    tags: ['v*.*.*']
permissions:
  id-token: write
  contents: read
jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build
        run: pip install --upgrade build
      - name: Sync version from git tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd python-packages/hookwarden
          python -c "
          import re, os
          version = os.environ['VERSION']
          path = 'pyproject.toml'
          src = open(path).read()
          new = re.sub(r'^version = .*$', f'version = \"{version}\"', src, count=1, flags=re.M)
          open(path, 'w').write(new)
          "
          head -20 pyproject.toml
        env:
          VERSION: ${{ github.ref_name }}

      # Stamp pinned per-target checksums into the shim's package data BEFORE build,
      # so the wheel ships with immutable canonical SHAs (DC-04 integrity foundation).
      # See RESEARCH §Anti-Patterns "Storing checksums.json by reading from network at runtime".
      - name: Stamp pinned checksums into shim package data
        run: python scripts/release/stamp-checksums.py "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sdist + wheel
        working-directory: python-packages/hookwarden
        run: python -m build
      - name: Publish to PyPI (Trusted Publisher OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-packages/hookwarden/dist
