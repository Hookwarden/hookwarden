name: Release (PyPI)
on:
  push:
    tags: ['v*.*.*']
permissions:
  id-token: write
  contents: read
jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build
        run: pip install --upgrade build

      # Race-safety gate: release-binaries.yml is the only producer of
      # `checksums.txt` on the GH Release for tag $TAG; stamp-checksums.py
      # below downloads that asset. Both workflows trigger on `tags: v*.*.*`,
      # so this job races release-binaries.yml. If we run before the
      # aggregate job in release-binaries.yml has created the GH Release,
      # `gh release download` 404s. Poll for up to 30 min for the Release
      # to exist (release-binaries builds 3 binaries cross-platform — typically
      # 8-15 min total). DC-17 producer/consumer chain made release.yml a
      # workflow_run consumer; release-py.yml stayed on the naive tag trigger
      # and inherits this race — close it here.
      - name: Wait for GH Release (release-binaries.yml producer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Polling for GH Release '$TAG' (produced by release-binaries.yml aggregate job)..."
          for i in {1..60}; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name -q .name >/dev/null 2>&1; then
              echo "GH Release '$TAG' is ready after $((i * 30))s."
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: GH Release '$TAG' did not appear within 30 min — release-binaries.yml failed or is stalled." >&2
          exit 1

      - name: Sync version from git tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd python-packages/hookwarden
          python -c "
          import re, os
          version = os.environ['VERSION']
          path = 'pyproject.toml'
          src = open(path).read()
          new = re.sub(r'^version = .*$', f'version = \"{version}\"', src, count=1, flags=re.M)
          open(path, 'w').write(new)
          "
          head -20 pyproject.toml
        env:
          VERSION: ${{ github.ref_name }}

      # Stamp pinned per-target checksums into the shim's package data BEFORE build,
      # so the wheel ships with immutable canonical SHAs (DC-04 integrity foundation).
      # See RESEARCH §Anti-Patterns "Storing checksums.json by reading from network at runtime".
      - name: Stamp pinned checksums into shim package data
        run: python scripts/release/stamp-checksums.py "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sdist + wheel
        working-directory: python-packages/hookwarden
        run: python -m build
      - name: Publish to PyPI (Trusted Publisher OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-packages/hookwarden/dist
