name: Wild scan (weekly OSS sweep)
# Re-scans the public OSS target corpus weekly and updates the
# "Found in the wild" table in README.md. Per-target findings stay
# private; only aggregate counts + the scan date are published.
#
# Edit the target list at .github/scripts/wild-targets.txt.
# Adding/removing a target: open a normal PR — the next cron run
# picks it up.

on:
  workflow_dispatch:
    inputs:
      hw_version:
        description: 'hookwarden version (e.g. 0.5.5 or "latest")'
        required: false
        default: 'latest'
  schedule:
    # Sunday 22:00 UTC — Monday-morning numbers for AMER + EMEA readers.
    - cron: '0 22 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Need a real ref to commit back onto a branch, not the merge SHA.
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace deps (needed for tsx)
        run: pnpm install --frozen-lockfile

      - name: Run wild scan
        env:
          HW_VERSION: ${{ inputs.hw_version || 'latest' }}
        run: pnpm exec tsx .github/scripts/wild-scan.ts

      - name: Open PR if README changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "No table changes."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/wild-scan-${DATE}"
          git config user.name "hookwarden-bot"
          git config user.email "bot@hookwarden.dev"
          # If a previous run on the same UTC day left the branch on
          # remote (merged-but-not-deleted, or a stale draft PR), drop
          # it explicitly so the new push is a clean fast-forward.
          # Branch is bot-owned / ephemeral / named by date — replacing
          # it is intentional, not destructive.
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "chore(readme): refresh wild-scan table (${DATE})"
          # --no-verify: the local pre-push hook runs `pnpm preflight`
          # (lint + purity + build + test), the developer gate. A bot
          # pushing a generated README-table refresh must not run it —
          # it was aborting every scheduled run. Real checks run on the PR.
          git push --no-verify --set-upstream origin "$BRANCH"
          gh pr create \
            --title "chore: refresh wild-scan table (${DATE})" \
            --body "Automated weekly refresh of the 'Found in the wild' table. Numbers were generated by .github/scripts/wild-scan.ts running hookwarden@latest against the corpus in .github/scripts/wild-targets.txt. See bugs-in-the-wild.md for methodology."
