name: DIST-03 Scoop smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'   # weekly Monday 13:00 UTC
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    # Cross-workflow sync: only fire from a successful Release run (or any
    # non-workflow_run trigger like schedule / dispatch). DC-18 removed the
    # pre-launch gate (Plan 04.2-08) now that binaries ship.
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name != 'workflow_run'
    runs-on: windows-latest
    steps:
      - name: Install Scoop
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope CurrentUser RemoteSigned -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' -OutFile 'install.ps1'
          .\install.ps1 -RunAsAdmin
          echo "$HOME\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Add bucket and install hookwarden
        shell: powershell
        run: |
          scoop bucket add hookwarden https://github.com/Hookwarden/scoop-bucket
          scoop install hookwarden

      - name: Verify --version round-trip
        shell: powershell
        run: |
          $installed = (hookwarden --version) -join "`n"
          $manifestVersion = (scoop info hookwarden | Select-String "Version") -replace '.*:\s*',''
          Write-Host "Installed: $installed"
          Write-Host "Manifest:  $manifestVersion"
          if (-not $installed.Contains($manifestVersion)) {
            throw "DIST-03 fail: binary --version ($installed) does not contain manifest version ($manifestVersion)"
          }
