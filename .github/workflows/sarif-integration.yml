# CLI-11 — verified SARIF upload to real GitHub Code Scanning.
# Runs sarif-integration.test.ts on every release tag. Requires repo secret
# SARIF_INTEGRATION_PAT — fine-grained PAT scoped to `code-scanning:write`
# on hookwarden/hookwarden-sarif-integration-test (the dedicated test repo).
# (Name cannot start with GITHUB_ — that prefix is reserved by GitHub Actions.)
# PR-time CI never has the secret; the test is `describe.skipIf(!HAS_TOKEN)`.
name: sarif-integration

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sarif-roundtrip:
    name: SARIF round-trip against real GitHub Code Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm exec tsc --build

      - name: Run SARIF integration test
        env:
          SARIF_INTEGRATION_PAT: ${{ secrets.SARIF_INTEGRATION_PAT }}
          SARIF_INTEGRATION_REPO: hookwarden/hookwarden-sarif-integration-test
          # Sentinel SHA pinned to main of hookwarden-sarif-integration-test.
          # GitHub's code-scanning/sarifs endpoint validates commit_sha exists in
          # the *target* repo — source-repo SHAs from this workflow do not. The
          # test repo is an inert sink, so this SHA is stable. Refresh if main moves:
          #   gh api repos/hookwarden/hookwarden-sarif-integration-test/commits/main --jq .sha
          SARIF_INTEGRATION_COMMIT_SHA: 0151e6827c8e912c23b09224bbcc151040a89579
        run: pnpm --filter hookwarden exec vitest run test/sarif-integration.test.ts
