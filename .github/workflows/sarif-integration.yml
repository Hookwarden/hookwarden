# CLI-11 — verified SARIF upload to real GitHub Code Scanning.
# Runs sarif-integration.test.ts on every release tag AND on PRs that touch
# the SARIF code path. Requires repo secret SARIF_INTEGRATION_PAT — fine-grained
# token with `code-scanning:write` on hookwarden/hookwarden-sarif-integration-test.
# Minted per run from the hookwarden-release-bot GitHub App (same app as release.yml),
# so there is no long-lived PAT to expire — the old SARIF_INTEGRATION_PAT did, after 90 days.
# Forked and Dependabot PRs don't receive secrets — no token is minted and the test
# self-skips via describe.skipIf(!HAS_TOKEN).
name: sarif-integration

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/cli/src/render/sarif.ts"
      - "packages/cli/test/sarif-integration.test.ts"
      - ".github/workflows/sarif-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sarif-roundtrip:
    name: SARIF round-trip against real GitHub Code Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm exec tsc --build

      - name: Mint short-lived token for the integration-test repo
        id: app-token
        # Forks and Dependabot PRs don't receive repo secrets; the test self-skips without a token.
        if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOOKWARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.HOOKWARDEN_BOT_APP_PRIVATE_KEY }}
          owner: Hookwarden
          repositories: hookwarden-sarif-integration-test
      - name: Run SARIF integration test
        env:
          SARIF_INTEGRATION_PAT: ${{ steps.app-token.outputs.token }}
          SARIF_INTEGRATION_REPO: hookwarden/hookwarden-sarif-integration-test
          # Sentinel SHA pinned to main of hookwarden-sarif-integration-test.
          # GitHub's code-scanning/sarifs endpoint validates commit_sha exists in
          # the *target* repo — source-repo SHAs from this workflow do not. The
          # test repo is an inert sink, so this SHA is stable. Refresh if main moves:
          #   gh api repos/hookwarden/hookwarden-sarif-integration-test/commits/main --jq .sha
          SARIF_INTEGRATION_COMMIT_SHA: 0151e6827c8e912c23b09224bbcc151040a89579
        run: pnpm --filter hookwarden exec vitest run test/sarif-integration.test.ts
