name: WinGet first-time submission
# One-shot workflow for the v0.3.1 inaugural Hookwarden.Hookwarden manifest
# submission to microsoft/winget-pkgs. Authors the 3 manifest YAMLs inline,
# validates + submits via wingetcreate using the bot's PAT.
#
# After the upstream PR merges, future versions are handled by the existing
# winget-release.yml (which uses `wingetcreate update`). This workflow can be
# deleted once the first PR merges upstream.
#
# Trigger: workflow_dispatch only (one-shot, manual).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to submit (no leading v)'
        required: true
        default: '0.3.1'
      sha256:
        description: 'SHA-256 of hookwarden-windows-x64.exe for this version'
        required: true
        default: 'dcb3e0029a386688b2684f32d4dc0d416b8b5b80966bc51f68c04e2b8b3f4466'

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Install wingetcreate
        shell: pwsh
        # `wingetcreate --version` exits 1 with help output (no version flag in
        # v1.12+); rely on subsequent `validate` step as the smoke check.
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile 'wingetcreate.exe'
          if (-not (Test-Path 'wingetcreate.exe')) { throw 'wingetcreate.exe download failed' }

      - name: Author Hookwarden.Hookwarden manifests
        shell: pwsh
        env:
          VERSION: ${{ github.event.inputs.version }}
          SHA256: ${{ github.event.inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "manifests/h/Hookwarden/Hookwarden/$env:VERSION"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $releaseDate = (Get-Date -Format 'yyyy-MM-dd')

          # 1. Version manifest (root)
          @"
          PackageIdentifier: Hookwarden.Hookwarden
          PackageVersion: $env:VERSION
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ | Set-Content "$dir/Hookwarden.Hookwarden.yaml" -Encoding utf8

          # 2. Installer manifest (portable single-file .exe)
          @"
          PackageIdentifier: Hookwarden.Hookwarden
          PackageVersion: $env:VERSION
          InstallerType: portable
          Commands:
            - hookwarden
          ReleaseDate: $releaseDate
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/Hookwarden/hookwarden/releases/download/v$env:VERSION/hookwarden-windows-x64.exe
              InstallerSha256: $env:SHA256
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ | Set-Content "$dir/Hookwarden.Hookwarden.installer.yaml" -Encoding utf8

          # 3. Default locale manifest (en-US)
          @"
          PackageIdentifier: Hookwarden.Hookwarden
          PackageVersion: $env:VERSION
          PackageLocale: en-US
          Publisher: Hookwarden
          PublisherUrl: https://hookwarden.dev
          PublisherSupportUrl: https://github.com/Hookwarden/hookwarden/issues
          PackageName: hookwarden
          PackageUrl: https://hookwarden.dev
          License: Apache-2.0
          LicenseUrl: https://github.com/Hookwarden/hookwarden/blob/main/LICENSE
          ShortDescription: Webhook signature-verification audit tool
          Description: |-
            hookwarden detects signature-verification bugs in webhook handler code.
            Open-source CLI for JavaScript / TypeScript and Python; finds issues
            in under five minutes with zero off-machine traffic.
          Moniker: hookwarden
          Tags:
            - webhook
            - security
            - audit
            - stripe
            - github
            - cli
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ | Set-Content "$dir/Hookwarden.Hookwarden.locale.en-US.yaml" -Encoding utf8

          Write-Host "Authored manifests:"
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Validate manifests
        shell: pwsh
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ./wingetcreate.exe validate "manifests/h/Hookwarden/Hookwarden/$env:VERSION/"

      - name: Submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          VERSION: ${{ github.event.inputs.version }}
          PAT: ${{ secrets.HOOKWARDEN_BOT_WINGET_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./wingetcreate.exe submit `
            --token $env:PAT `
            --prtitle "Add Hookwarden.Hookwarden version $env:VERSION" `
            "manifests/h/Hookwarden/Hookwarden/$env:VERSION/"
