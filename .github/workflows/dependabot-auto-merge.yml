name: Dependabot auto-merge

# Auto-merges Dependabot PRs for patch + minor bumps once CI is green, and
# holds every major bump for human review. Relies on:
#   - repo setting "Allow auto-merge" (enabled)
#   - branch protection on `main` requiring the `lint-test-build` check, so
#     `--auto` waits for green before merging (admins are exempt, so the
#     maintainer's direct release-version push to `main` is unaffected).
# Majors (e.g. TypeScript 5→6, Vitest 3→4) are intentionally NOT auto-merged —
# they need a deliberate migration. Grouped PRs that contain a major are held
# too (fetch-metadata reports the highest update-type in the group).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on held major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "🤚 Held for review — this is a **major** version bump (\`${{ steps.meta.outputs.dependency-names }}\`). Auto-merge only covers patch + minor; majors need a deliberate migration."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
