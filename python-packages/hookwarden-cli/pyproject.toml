[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookwarden-cli"
version = "0.0.0"
description = "Did you mean `hookwarden`? See https://hookwarden.dev — this is a defensive registration package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Adelina Lipsa", email = "adelina.lipsa@gmail.com" }]
keywords = ["hookwarden", "webhook", "security", "audit"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
hookwarden-cli = "hookwarden_cli.__main__:main"

[project.urls]
Homepage = "https://hookwarden.dev"
Repository = "https://github.com/hookwarden/hookwarden"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
