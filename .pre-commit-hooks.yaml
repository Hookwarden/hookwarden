# Pre-commit framework hook registration for hookwarden.
# Users add this repo to their .pre-commit-config.yaml and `pre-commit run` invokes hookwarden
# against staged files. The hookwarden Python package downloads the standalone binary on first
# invocation (no Node runtime required) — see python-packages/hookwarden/.
#
# How language: python works here:
#  1. pre-commit clones THIS repo into its hook cache and runs `pip install .` — this resolves
#     against the stub root pyproject.toml (hookwarden-precommit-stub, an empty package).
#  2. pre-commit then installs every package in `additional_dependencies` — this brings in
#     the real `hookwarden` shim from PyPI (python-packages/hookwarden/).
#  3. pre-commit invokes the `entry: hookwarden scan` console script, which resolves to the
#     real shim's main() (registered by python-packages/hookwarden/pyproject.toml).
# The stub root pyproject is needed because additional_dependencies SUPPLEMENTS pip install .,
# it does not replace it. ruff-pre-commit's repo root is itself a Python package (their
# wrapper is the package); we can't restructure the Node monorepo so we ship a stub instead.
# Consumers can pin a specific shim version via `additional_dependencies: ['hookwarden==X.Y.Z']`
# in their own .pre-commit-config.yaml.
- id: hookwarden
  name: hookwarden (webhook signature audit)
  description: Detects webhook signature-verification bugs in JS/TS and Python.
  entry: hookwarden scan
  language: python
  additional_dependencies: ['hookwarden']
  pass_filenames: false
  args: ['--diff-base', 'HEAD', '--diff-only']
  types_or: [javascript, jsx, ts, tsx, python]
  stages: [pre-commit, manual]
  minimum_pre_commit_version: '3.0.0'
