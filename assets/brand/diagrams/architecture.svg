<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="hookwarden architecture: source AST and YAML rules feed the pure engine, which feeds the CLI; CLI emits text, JSON, and SARIF.">
  <defs>
    <radialGradient id="hilite" cx="640" cy="260" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="60%"  stop-color="#4F46E5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="engine-glow" cx="640" cy="260" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flow-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#6366F1" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818CF8"/>
    </marker>

    <symbol id="ast-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="4" r="2"/>
        <circle cx="5"  cy="14" r="2"/>
        <circle cx="19" cy="14" r="2"/>
        <circle cx="2"  cy="22" r="1.6"/>
        <circle cx="8"  cy="22" r="1.6"/>
        <circle cx="16" cy="22" r="1.6"/>
        <circle cx="22" cy="22" r="1.6"/>
        <path d="M12 6 L5 12 M12 6 L19 12 M5 16 L2 20 M5 16 L8 20 M19 16 L16 20 M19 16 L22 20"/>
      </g>
    </symbol>

    <symbol id="yaml-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M7 9 L12 9 M7 13 L17 13 M7 17 L14 17"/>
        <circle cx="5"  cy="9"  r="0.6" fill="#818CF8"/>
        <circle cx="5"  cy="13" r="0.6" fill="#818CF8"/>
        <circle cx="5"  cy="17" r="0.6" fill="#818CF8"/>
      </g>
    </symbol>

    <symbol id="cli-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 10 L11 13 L7 16 M13 16 L17 16"/>
      </g>
    </symbol>

    <symbol id="engine-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#A5B4FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.5"/>
        <path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12 M5 5 L7 7 M17 17 L19 19 M5 19 L7 17 M17 7 L19 5"/>
      </g>
    </symbol>
  </defs>

  <rect width="1280" height="520" fill="#0B0F14"/>
  <rect width="1280" height="520" fill="url(#hilite)"/>
  <circle cx="640" cy="260" r="280" fill="url(#engine-glow)">
    <animate attributeName="r" values="240;300;240" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Top-left node: Source AST -->
  <g>
    <rect x="80" y="60" width="320" height="120" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <use href="#ast-icon" x="100" y="80" width="28" height="28"/>
    <text x="138" y="100" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#7B8AE6" letter-spacing="2.4">INPUT</text>
    <text x="100" y="138" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#E5E7EB">Source AST</text>
    <text x="100" y="162" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#94A3B8">@babel/parser  ·  web-tree-sitter</text>
  </g>

  <!-- Top-right node: rules catalog -->
  <g>
    <rect x="880" y="60" width="320" height="120" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <use href="#yaml-icon" x="900" y="80" width="28" height="28"/>
    <text x="938" y="100" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#7B8AE6" letter-spacing="2.4">CATALOG</text>
    <text x="900" y="138" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#E5E7EB">@hookwarden/rules</text>
    <text x="900" y="162" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#94A3B8">YAML  ·  predicate factories</text>
  </g>

  <!-- Center node: engine (pulsing accent border) -->
  <g>
    <rect x="420" y="220" width="440" height="140" rx="16" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
    <rect x="420" y="220" width="440" height="140" rx="16" fill="none" stroke="#818CF8" stroke-width="1.4">
      <animate attributeName="stroke-width" values="0.8;3.4;0.8" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.05;0.85" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <use href="#engine-icon" x="448" y="244" width="32" height="32"/>
    <text x="488" y="266" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#A5B4FC" letter-spacing="2.4">PURE  ·  NO I/O  ·  BROWSER-SAFE</text>
    <text x="448" y="304" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#E5E7EB">@hookwarden/engine</text>
    <text x="448" y="332" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#94A3B8">discovery  ·  reachability  ·  evidence</text>

    <!-- inner data activity (pulsing dots) -->
    <g>
      <circle cx="800" cy="260" r="3" fill="#34D399">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="278" r="3" fill="#FBBF24">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="296" r="3" fill="#F87171">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="812" y="264" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="#94A3B8">verified</text>
      <text x="812" y="282" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="#94A3B8">manual-review</text>
      <text x="812" y="300" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="#94A3B8">not-verified</text>
    </g>
  </g>

  <!-- Animated input arrows: AST → engine -->
  <g fill="none" stroke-linecap="round">
    <path d="M 240 184 Q 240 220 420 260" stroke="#1E293B" stroke-width="2"/>
    <path d="M 240 184 Q 240 220 420 260" stroke="#818CF8" stroke-width="2.4" stroke-dasharray="10 14" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- Animated input arrows: rules → engine -->
    <path d="M 1040 184 Q 1040 220 860 260" stroke="#1E293B" stroke-width="2"/>
    <path d="M 1040 184 Q 1040 220 860 260" stroke="#818CF8" stroke-width="2.4" stroke-dasharray="10 14" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>

    <!-- engine → CLI -->
    <path d="M 640 360 L 640 396" stroke="#1E293B" stroke-width="2"/>
    <path d="M 640 360 L 640 396" stroke="#818CF8" stroke-width="2.4" stroke-dasharray="8 12" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bottom node: CLI -->
  <g>
    <rect x="480" y="400" width="320" height="80" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <use href="#cli-icon" x="500" y="420" width="28" height="28"/>
    <text x="538" y="440" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#7B8AE6" letter-spacing="2.4">RENDER  ·  EXIT CODES</text>
    <text x="500" y="466" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#E5E7EB">hookwarden  CLI</text>
  </g>

  <!-- Output format chips, fading in/out -->
  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="2">
    <g>
      <rect x="180"  y="430" width="92" height="34" rx="17" fill="#0F172A" stroke="#1E293B"/>
      <text x="226" y="453" text-anchor="middle" fill="#E5E7EB">text</text>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="64"   y="430" width="92" height="34" rx="17" fill="#0F172A" stroke="#1E293B"/>
      <text x="110"  y="453" text-anchor="middle" fill="#E5E7EB">JSON</text>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1008" y="430" width="92" height="34" rx="17" fill="#0F172A" stroke="#1E293B"/>
      <text x="1054" y="453" text-anchor="middle" fill="#E5E7EB">SARIF</text>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1124" y="430" width="92" height="34" rx="17" fill="#0F172A" stroke="#1E293B"/>
      <text x="1170" y="453" text-anchor="middle" fill="#E5E7EB">CI</text>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- CLI → outputs splines -->
  <g fill="none" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round">
    <path d="M 510 460 Q 380 460 272 447"/>
    <path d="M 480 440 Q 320 420 156 447"/>
    <path d="M 770 460 Q 900 460 1008 447"/>
    <path d="M 800 440 Q 970 420 1124 447"/>
  </g>
</svg>
