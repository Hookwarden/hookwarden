<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="hookwarden architecture: source AST and YAML rules feed the pure engine, which feeds the CLI; CLI emits text, JSON, SARIF, CI.">
  <defs>
    <radialGradient id="hilite" cx="640" cy="300" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="60%"  stop-color="#4F46E5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="engine-glow" cx="640" cy="320" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818CF8"/>
    </marker>

    <symbol id="ast-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="4" r="2"/>
        <circle cx="5"  cy="14" r="2"/>
        <circle cx="19" cy="14" r="2"/>
        <circle cx="2"  cy="22" r="1.6"/>
        <circle cx="8"  cy="22" r="1.6"/>
        <circle cx="16" cy="22" r="1.6"/>
        <circle cx="22" cy="22" r="1.6"/>
        <path d="M12 6 L5 12 M12 6 L19 12 M5 16 L2 20 M5 16 L8 20 M19 16 L16 20 M19 16 L22 20"/>
      </g>
    </symbol>

    <symbol id="yaml-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M7 9 L12 9 M7 13 L17 13 M7 17 L14 17"/>
        <circle cx="5"  cy="9"  r="0.6" fill="#818CF8"/>
        <circle cx="5"  cy="13" r="0.6" fill="#818CF8"/>
        <circle cx="5"  cy="17" r="0.6" fill="#818CF8"/>
      </g>
    </symbol>

    <symbol id="cli-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 10 L11 13 L7 16 M13 16 L17 16"/>
      </g>
    </symbol>

    <symbol id="engine-icon" viewBox="0 0 24 24">
      <g fill="none" stroke="#A5B4FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.5"/>
        <path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12 M5 5 L7 7 M17 17 L19 19 M5 19 L7 17 M17 7 L19 5"/>
      </g>
    </symbol>
  </defs>

  <rect width="1280" height="600" fill="#0B0F14"/>
  <rect width="1280" height="600" fill="url(#hilite)"/>
  <circle cx="640" cy="320" r="320" fill="url(#engine-glow)">
    <animate attributeName="r" values="280;340;280" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Top-left node: Source AST -->
  <g>
    <rect x="120" y="60" width="300" height="120" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <use href="#ast-icon" x="140" y="80" width="26" height="26"/>
    <text x="176" y="98" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#7B8AE6" letter-spacing="2.4">INPUT</text>
    <text x="140" y="138" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#E5E7EB">Source AST</text>
    <text x="140" y="162" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#94A3B8">@babel/parser  ·  web-tree-sitter</text>
  </g>

  <!-- Top-right node: rules catalog -->
  <g>
    <rect x="860" y="60" width="300" height="120" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <use href="#yaml-icon" x="880" y="80" width="26" height="26"/>
    <text x="916" y="98" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#7B8AE6" letter-spacing="2.4">CATALOG</text>
    <text x="880" y="138" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#E5E7EB">@hookwarden/rules</text>
    <text x="880" y="162" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#94A3B8">YAML  ·  predicate factories</text>
  </g>

  <!-- Animated input arrows: land on engine TOP edge (y=260), well clear of verdict legend at bottom -->
  <g fill="none" stroke-linecap="round">
    <path d="M 270 184 Q 270 220 440 258" stroke="#1E293B" stroke-width="2"/>
    <path d="M 270 184 Q 270 220 440 258" stroke="#818CF8" stroke-width="2.4" stroke-dasharray="10 14" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <path d="M 1010 184 Q 1010 220 840 258" stroke="#1E293B" stroke-width="2"/>
    <path d="M 1010 184 Q 1010 220 840 258" stroke="#818CF8" stroke-width="2.4" stroke-dasharray="10 14" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Center node: engine — verdict legend along the BOTTOM as a horizontal row, well below arrows landing on top edge -->
  <g>
    <rect x="320" y="260" width="640" height="200" rx="16" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
    <rect x="320" y="260" width="640" height="200" rx="16" fill="none" stroke="#818CF8" stroke-width="1.4">
      <animate attributeName="stroke-width" values="0.8;3.4;0.8" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.05;0.85" dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <use href="#engine-icon" x="360" y="290" width="28" height="28"/>
    <text x="398" y="310" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#A5B4FC" letter-spacing="2.4">PURE  ·  NO I/O  ·  BROWSER-SAFE</text>
    <text x="640" y="358" text-anchor="middle" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="32" font-weight="700" fill="#E5E7EB">@hookwarden/engine</text>
    <text x="640" y="384" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#94A3B8">discovery  ·  reachability  ·  evidence</text>

    <!-- divider above verdict legend -->
    <line x1="360" y1="412" x2="920" y2="412" stroke="#1E293B" stroke-width="1"/>

    <!-- verdict legend: three colored dots in a horizontal row, centered as a group inside the engine card -->
    <g font-family="'Geist Mono', ui-monospace, monospace" font-size="13">
      <g transform="translate(384,438)">
        <circle cx="0" cy="-4" r="4" fill="#34D399">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="0" fill="#E5E7EB">verified</text>
      </g>
      <g transform="translate(560,438)">
        <circle cx="0" cy="-4" r="4" fill="#FBBF24">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="0" fill="#E5E7EB">manual-review</text>
      </g>
      <g transform="translate(784,438)">
        <circle cx="0" cy="-4" r="4" fill="#F87171">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="0" fill="#E5E7EB">not-verified</text>
      </g>
    </g>
  </g>

  <!-- engine → CLI vertical arrow -->
  <g fill="none" stroke-linecap="round">
    <path d="M 640 460 L 640 498" stroke="#1E293B" stroke-width="2"/>
    <path d="M 640 460 L 640 498" stroke="#818CF8" stroke-width="2.4" stroke-dasharray="8 12" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bottom-center node: CLI -->
  <g>
    <rect x="480" y="498" width="320" height="64" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <use href="#cli-icon" x="500" y="514" width="22" height="22"/>
    <text x="530" y="530" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="#7B8AE6" letter-spacing="2.4">RENDER  ·  EXIT CODES</text>
    <text x="500" y="552" font-family="Geist, 'Geist Sans', system-ui, sans-serif" font-size="20" font-weight="600" fill="#E5E7EB">hookwarden  CLI</text>
  </g>

  <!-- Output chips: single centered row directly below CLI, evenly spaced, no decorative splines.
       Group span x=420..860 → centered on x=640 (matches CLI center exactly). -->
  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="2">
    <g>
      <rect x="420" y="572" width="92" height="24" rx="12" fill="#0F172A" stroke="#1E293B"/>
      <text x="466" y="588" text-anchor="middle" fill="#E5E7EB">text</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="536" y="572" width="92" height="24" rx="12" fill="#0F172A" stroke="#1E293B"/>
      <text x="582" y="588" text-anchor="middle" fill="#E5E7EB">JSON</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="652" y="572" width="92" height="24" rx="12" fill="#0F172A" stroke="#1E293B"/>
      <text x="698" y="588" text-anchor="middle" fill="#E5E7EB">SARIF</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="768" y="572" width="92" height="24" rx="12" fill="#0F172A" stroke="#1E293B"/>
      <text x="814" y="588" text-anchor="middle" fill="#E5E7EB">CI</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
