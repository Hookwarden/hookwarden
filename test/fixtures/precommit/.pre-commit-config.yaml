# Fixture pre-commit config for DIST-01 CI smoke test.
# `repo: local` would skip cloning, but we want to exercise the real pre-commit framework
# path that downloads our PyPI shim and invokes the binary. The CI job substitutes
# `repo: <ABSOLUTE_PATH_TO_REPO_ROOT>` at runtime so pre-commit treats the local checkout
# as a git repo and reads our .pre-commit-hooks.yaml.
#
# Dependency chain — this fixture only works end-to-end after Phase 4.2 ships v0.3.0:
#   1. release-binaries.yml uploads hookwarden-{linux,windows}-* binaries to the v0.3.0 release
#   2. release-py.yml publishes the `hookwarden` PyPI shim with checksums.json stamped
#      against the v0.3.0 binary SHAs (stamp-checksums.py)
#   3. THEN pre-commit can install the shim (PyPI exists), the shim can download the binary
#      (SHA-pinned URL exists), and the binary can scan the fixture (RULES-03 flags it)
# CI gates dist-01 on `vars.PHASE_4X_BINARIES_SHIPPED == 'true'`; the aggregate job in
# release-binaries.yml flips that variable on the first successful tag-push. Until then
# this fixture is intentionally skipped — there is no useful local override (the shim
# rejects unstamped wheels with "no SHA-256 pinned for target ...").
repos:
  - repo: REPO_ROOT_PLACEHOLDER
    rev: HEAD
    hooks:
      - id: hookwarden
