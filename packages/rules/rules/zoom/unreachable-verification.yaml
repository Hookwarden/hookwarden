schema_version: 1
rule_id: zoom/unreachable-verification
provider: zoom
severity: high
emits_state: manual-review
message: |
  Zoom webhook handler imports a crypto module (`node:crypto`,
  `hashlib`/`hmac`, `hash_hmac`) but the manual HMAC verification path
  is not reachable from the handler entry within 3 hops. The verification
  may be conditional, dynamically dispatched, or in dead code — static
  analysis cannot determine whether every request goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken (especially on runtime events, not
  just on the initial URL-validation handshake).
matcher: null
predicate: zoom-unreachable-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.zoom.us/docs/api/rest/webhook-reference/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
