schema_version: 1
rule_id: zoom/unreachable-verification
provider: zoom
severity: high
emits_state: manual-review
message: |
  Zoom webhook handler imports a crypto module (`node:crypto`,
  `hashlib`/`hmac`, `hash_hmac`) but the manual HMAC verification path
  is not reachable from the handler entry within 3 hops. The verification
  may be conditional, dynamically dispatched, or in dead code — static
  analysis cannot determine whether every request goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken (especially on runtime events, not
  just on the initial URL-validation handshake).
matcher: null
predicate: zoom-unreachable-verification
