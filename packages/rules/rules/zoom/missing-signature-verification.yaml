schema_version: 1
rule_id: zoom/missing-signature-verification
provider: zoom
severity: critical
emits_state: not-verified
message: |
  Zoom webhook handler does not appear to verify the `X-Zm-Signature`
  header before processing the request. Zoom signs runtime events with
  HMAC-SHA256 over `v0:${X-Zm-Request-Timestamp}:${rawBody}` (the Slack
  signing recipe) and the header value is `v0=<hex>`. No verification
  path (signature-header read OR manual HMAC) was detected reachable
  from this handler.

  Fix: read `X-Zm-Signature` (strip the `v0=` prefix), compute
  `crypto.createHmac('sha256', secretToken).update(\`v0:\${ts}:\${rawBody}\`).digest('hex')`
  (Node) or the Python/PHP equivalents, then constant-time compare
  against the hex portion of the header.
matcher: null
predicate: zoom-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.zoom.us/docs/api/rest/webhook-reference/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
