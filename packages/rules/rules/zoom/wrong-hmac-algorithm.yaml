schema_version: 1
rule_id: zoom/wrong-hmac-algorithm
provider: zoom
severity: critical
emits_state: not-verified
message: |
  Zoom webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. Zoom signs requests with
  HMAC-SHA256 and hex encoding (under a `v0=` prefix) — any other
  algorithm (MD5, SHA-1, SHA-384, SHA-512) will never match, so
  verification cannot succeed.

  Fix: `crypto.createHmac('sha256', secretToken)` (Node),
  `hmac.new(secret_token.encode(), msg, hashlib.sha256)` (Python),
  or `hash_hmac('sha256', $msg, $secret)` (PHP).
matcher: null
predicate: zoom-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.zoom.us/docs/api/rest/webhook-reference/
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
