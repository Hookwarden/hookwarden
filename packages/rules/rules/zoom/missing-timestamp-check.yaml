schema_version: 1
rule_id: zoom/missing-timestamp-check
provider: zoom
severity: high
emits_state: manual-review
message: |
  Zoom webhook handler computes HMAC manually but no timestamp tolerance
  check is reachable from the handler. Zoom signs
  `v0:${X-Zm-Request-Timestamp}:${rawBody}` — without rejecting
  deliveries whose timestamp is outside a tolerance window (~5 minutes
  is conventional), an attacker who captures one signed webhook can
  replay it indefinitely.

  Recommended: read `X-Zm-Request-Timestamp`, parse to integer, and
  reject any request where `Math.abs(Date.now() / 1000 - ts) > 300`
  (Node) or `abs(time.time() - int(ts)) > 60 * 5` (Python).
matcher: null
predicate: zoom-missing-timestamp-check
