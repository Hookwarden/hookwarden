schema_version: 1
rule_id: slack/missing-signature-verification
provider: slack
severity: critical
emits_state: not-verified
message: |
  Slack webhook handler does not appear to verify the X-Slack-Signature header
  before processing the request. Neither `verifyRequestSignature` (@slack/events-api)
  nor `SignatureVerifier.is_valid_request` (Python slack_sdk) is reachable from
  this handler within 3 hops, and no manual HMAC-SHA256 path was detected.

  Slack docs: "Verify the request comes from Slack by computing an HMAC-SHA256
  hash of the timestamp and request body using your app's signing secret as the
  key, then comparing it to the value in the X-Slack-Signature header."

  Fix: use `@slack/bolt`'s built-in receiver, or call
  `verifyRequestSignature({ signingSecret, requestSignature, requestTimestamp,
  body })` (Node) or `SignatureVerifier(signing_secret).is_valid_request(body,
  headers)` (Python). The canonical-string is `'v0:' + ts + ':' + body` —
  HMAC-SHA256 hex, prefixed `v0=` in the header.
matcher: null
predicate: slack-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://api.slack.com/authentication/verifying-requests-from-slack
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
