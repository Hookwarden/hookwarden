schema_version: 1
rule_id: slack/timing-unsafe-comparison
provider: slack
severity: critical
emits_state: not-verified
message: |
  Slack webhook handler computes an HMAC-SHA256 manually but does not call
  `crypto.timingSafeEqual` (Node) or `hmac.compare_digest` (Python) for
  signature comparison. Plain `==` / `===` against the hex HMAC string leaks
  timing information.

  Fix: compare via `crypto.timingSafeEqual(Buffer.from('v0=' + expected),
  Buffer.from(provided))` in Node, or `hmac.compare_digest('v0=' + expected,
  provided)` in Python.
matcher: null
predicate: slack-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://api.slack.com/authentication/verifying-requests-from-slack
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
