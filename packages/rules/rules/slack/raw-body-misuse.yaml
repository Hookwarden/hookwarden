schema_version: 1
rule_id: slack/raw-body-misuse
provider: slack
severity: critical
emits_state: not-verified
message: |
  Slack webhook handler reads the X-Slack-Signature header (or calls
  `verifyRequestSignature`) but does not appear to receive the request body as
  raw bytes. Slack's HMAC is computed over `'v0:' + timestamp + ':' + raw_body`
  — once `express.json()` (or any other JSON middleware) parses the body, the
  bytes used for the HMAC differ from what was sent and verification fails on
  every webhook delivery.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  webhook route only, or use `@slack/bolt`'s ExpressReceiver which handles
  this correctly.
matcher: null
predicate: slack-raw-body-misuse
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://api.slack.com/authentication/verifying-requests-from-slack
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://docs.stripe.com/webhooks#verify-events
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
