message: |
  Library-based verification detected: `verifyRequestSignature` (@slack/events-api)
  or `SignatureVerifier.is_valid_request` (Python slack_sdk) is reachable from
  this handler within 3 hops. The Slack SDK enforces the v0 canonical-string
  construction, HMAC-SHA256 + hex, the 5-minute timestamp tolerance, and
  constant-time comparison.
