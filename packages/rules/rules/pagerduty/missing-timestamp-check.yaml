schema_version: 1
rule_id: pagerduty/missing-timestamp-check
provider: pagerduty
severity: high
emits_state: manual-review
message: |
  PagerDuty webhook handler computes HMAC manually but no timestamp or
  delivery-ID dedup check is reachable from the handler. PagerDuty does
  not send a dedicated timestamp header in its v3 webhook integration —
  applications must dedupe by an incident / event identifier in the
  payload to avoid indefinite replays of a captured signed delivery.

  Recommended: persist the incident or event identifier from the payload
  (e.g. Redis SETNX with a 10-minute TTL) and reject any request whose
  identifier has already been processed.
