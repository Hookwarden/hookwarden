schema_version: 1
rule_id: pagerduty/missing-signature-verification
provider: pagerduty
severity: critical
emits_state: not-verified
message: |
  PagerDuty v3 webhook handler does not appear to verify the
  `X-PagerDuty-Signature` header before processing the request. PagerDuty
  has no canonical first-party webhook SDK — verification is documented as
  inline HMAC-SHA256 over the raw request body, hex-encoded, compared with
  `crypto.timingSafeEqual`. No such verification path was detected
  reachable from this handler.

  Note: PagerDuty's signature header is comma-separated `v1=<hex>,v1=<hex>`
  during key rotation — the handler must iterate ALL tokens and accept on
  any match (see `pagerduty/multi-signature-rotation-mishandled`).

  Fix: parse `X-PagerDuty-Signature` into its comma-separated tokens, compute
  `crypto.createHmac('sha256', secret).update(rawBody).digest('hex')` (Node)
  or `hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python) or `hash_hmac('sha256', $rawBody, $secret)` (PHP), then
  constant-time-compare each `v1=...` token against the computed digest.
matcher: null
predicate: pagerduty-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.pagerduty.com/docs/db0fa8c8984fc-overview
