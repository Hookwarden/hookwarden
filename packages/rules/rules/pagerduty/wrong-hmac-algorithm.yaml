schema_version: 1
rule_id: pagerduty/wrong-hmac-algorithm
provider: pagerduty
severity: critical
emits_state: not-verified
message: |
  PagerDuty webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. PagerDuty v3 signs requests with
  HMAC-SHA256 and hex encoding — any other algorithm (MD5, SHA-1, SHA-384,
  SHA-512) will never match, so verification cannot succeed.

  Fix: `crypto.createHmac('sha256', secret)` (Node),
  `hmac.new(secret.encode(), raw_body, hashlib.sha256)` (Python),
  or `hash_hmac('sha256', $rawBody, $secret)` (PHP).
matcher: null
predicate: pagerduty-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.pagerduty.com/docs/db0fa8c8984fc-overview
