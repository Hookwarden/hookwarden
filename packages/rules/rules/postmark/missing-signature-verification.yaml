schema_version: 1
rule_id: postmark/missing-signature-verification
provider: postmark
severity: critical
emits_state: not-verified
message: |
  Postmark webhook handler does not appear to perform any authentication
  on incoming requests. Postmark's default authentication model is HTTP
  Basic Auth + IP allowlist (NOT HMAC). If your handler neither reads
  the `Authorization` header nor checks the request IP against
  Postmark's documented IP range, the endpoint is completely open and
  any actor on the public internet can post fake webhook events to it.

  Fix (Basic Auth, primary): set HTTP Basic Auth credentials on the
  Postmark webhook configuration; in the handler, read
  `req.headers.authorization`, parse the Basic Auth header, and
  constant-time-compare both username and password against env vars.
  Fix (IP allowlist, supplementary): additionally verify the request IP
  is in the documented Postmark webhook IP range.
matcher: null
predicate: postmark-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://postmarkapp.com/developer/webhooks/webhooks-overview
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
