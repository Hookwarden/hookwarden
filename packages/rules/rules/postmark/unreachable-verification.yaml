schema_version: 1
rule_id: postmark/unreachable-verification
provider: postmark
severity: high
emits_state: manual-review
message: |
  Postmark webhook handler imports a Postmark SDK but no Basic Auth /
  IP-allowlist verification path is reachable from the handler entry
  within 3 hops. The verification may be conditional, dynamically
  dispatched, or in dead code — static analysis cannot determine whether
  every request goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken.
matcher: null
predicate: postmark-unreachable-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://postmarkapp.com/developer/webhooks/webhooks-overview
fix:
