schema_version: 1
rule_id: postmark/timing-unsafe-comparison
provider: postmark
severity: critical
emits_state: not-verified
message: |
  Postmark webhook handler compares the Basic Auth credential against
  the expected value without using a constant-time comparison function.
  Plain `==` / `===` against a credential leaks timing information that
  lets an attacker bisect the credential byte-by-byte over many requests.

  Fix: compare via `crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(provided))`
  in Node, `hmac.compare_digest(expected, provided)` in Python, or
  `hash_equals($expected, $provided)` in PHP. For Basic Auth, compare
  the username and password segments separately under constant-time
  equality.
matcher: null
predicate: postmark-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://postmarkapp.com/developer/webhooks/webhooks-overview
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
