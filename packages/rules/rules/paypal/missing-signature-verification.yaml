schema_version: 1
rule_id: paypal/missing-signature-verification
provider: paypal
severity: critical
emits_state: not-verified
message: |
  PayPal webhook handler does not appear to verify the event before
  processing it. PayPal signs each delivery with SHA256withRSA over
  `transmission_id|transmission_time|webhook_id|crc32(body)` and sends the
  signature in `PAYPAL-TRANSMISSION-SIG` with the cert location in
  `PAYPAL-CERT-URL`. No SDK verify call, postback to
  `/v1/notifications/verify-webhook-signature`, or local RSA check was
  detected for this handler — anyone who knows the URL can forge
  `PAYMENT.CAPTURE.COMPLETED` and similar events.

  Fix: POST the `paypal-transmission-id`, `paypal-transmission-time`,
  `paypal-transmission-sig`, `paypal-cert-url`, `paypal-auth-algo` headers,
  your webhook ID and the event body to `/v1/notifications/verify-webhook-signature`
  and continue only when `verification_status === "SUCCESS"`. If you verify
  locally instead, only fetch the certificate from a PayPal-owned host.
matcher: null
predicate: paypal-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.paypal.com/api/rest/webhooks/rest/
references:
  - https://developer.paypal.com/docs/api/webhooks/v1/#verify-webhook-signature_post
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
