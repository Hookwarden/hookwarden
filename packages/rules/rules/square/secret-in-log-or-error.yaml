schema_version: 1
rule_id: square/secret-in-log-or-error
provider: square
severity: high
emits_state: not-verified
message: |
  Square webhook handler logs or throws an error containing the
  webhook secret as a value (e.g. `console.log(WEBHOOK_SECRET)`,
  `throw new Error(`secret=${secret}`)`). When log storage (CloudWatch,
  Datadog, Sentry) is compromised, every webhook secret in those logs goes
  with it. The Sept 2025 GitHub `X-Github-Encoded-Secret` incident is the
  canonical example.

  This rule fires even when the log is gated behind
  `NODE_ENV !== 'production'` — the secret still ends up in source code,
  CI artifacts, and developer-machine log files.

  Defensible patterns (silent):
    - `console.log(!!secret)` or `Boolean(secret)` — boolean only
    - `console.log(secret.length)` — length only
    - `console.log(sha256(secret))` / `createHmac('sha256', secret).digest('hex')` — hashed
    - `secret.slice(0, 4)` (≤8 chars) — manual-review (auditor judges)

  Fix: never log or throw the secret value. Log a derived non-reversible
  signal (boolean, length, or hash). Audit existing log destinations for
  exposure and rotate the secret if it ever shipped.
matcher: null
predicate: square-secret-in-log-or-error
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://developer.squareup.com/docs/webhooks/step3validate
references:
  - https://beyondmachines.net/event_details/github-webhook-secret-exposure-incident-secrets-inadvertently-leaked-in-http-headers-between-september-2025-and-january-2026-l-j-3-7-t
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.6"]
  iso27001: ["A.8.10", "A.8.12", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.12"]
  nist_ai_rmf: ["GOVERN", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Replace secret-in-log with a derived non-reversible signal (boolean, length, hash); rotate the secret if it ever shipped — see provider_docs_url"
  codegen: null
