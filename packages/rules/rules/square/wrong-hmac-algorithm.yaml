schema_version: 1
rule_id: square/wrong-hmac-algorithm
provider: square
severity: critical
emits_state: not-verified
message: |
  Square webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. Square signs webhook payloads with
  HMAC-SHA256 — any other algorithm (MD5, SHA-1, SHA-384, SHA-512) will never
  match.

  Fix: `crypto.createHmac('sha256', signatureKey)` (Node) or
  `hmac.new(signature_key, msg, hashlib.sha256)` (Python).
matcher: null
predicate: square-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.squareup.com/docs/webhooks/step3validate
