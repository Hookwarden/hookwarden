schema_version: 1
rule_id: square/raw-body-misuse
provider: square
severity: critical
emits_state: not-verified
message: |
  Square webhook handler reads the X-Square-HmacSha256-Signature header (or
  calls `WebhooksHelper.verifySignature`) but does not appear to receive the
  request body as raw bytes. Square's HMAC is computed over `URL + raw_body`
  — once `express.json()` (or any other JSON middleware) parses the body, the
  bytes used for the HMAC differ from what was sent and verification fails on
  every webhook delivery.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  webhook route only, and feed the Buffer to the HMAC update.
matcher: null
predicate: square-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.squareup.com/docs/webhooks/step3validate
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://docs.stripe.com/webhooks#verify-events
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
