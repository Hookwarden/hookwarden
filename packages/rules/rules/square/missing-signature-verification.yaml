schema_version: 1
rule_id: square/missing-signature-verification
provider: square
severity: critical
emits_state: not-verified
message: |
  Square webhook handler does not appear to verify the X-Square-HmacSha256-Signature
  header before processing the event. Neither `WebhooksHelper.verifySignature`
  (Node `square` SDK) nor `WebhooksHelper.is_valid_webhook_event_signature`
  (Python `squareup`) is reachable from this handler within 3 hops, and no manual
  HMAC path was detected.

  Square docs: "Validate the event notification by recreating the HMAC-SHA256
  signature over the URL + raw request body using your webhook subscription
  signature key, then comparing it to the X-Square-HmacSha256-Signature header."

  Fix: compute `crypto.createHmac('sha256', signatureKey).update(notificationUrl
  + rawBody).digest('base64')` and compare via `crypto.timingSafeEqual` (Node),
  or use the official `WebhooksHelper.verifySignature(...)` helper.
matcher: null
predicate: square-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.squareup.com/docs/webhooks/step3validate
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
