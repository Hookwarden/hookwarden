schema_version: 1
rule_id: square/timing-unsafe-comparison
provider: square
severity: critical
emits_state: not-verified
message: |
  Square webhook handler computes an HMAC-SHA256 manually but does not call
  `crypto.timingSafeEqual` (Node) or `hmac.compare_digest` (Python) for
  signature comparison. Plain `==` / `===` against a base64 HMAC string leaks
  timing information.

  Fix: compare via `crypto.timingSafeEqual(Buffer.from(expected, 'base64'),
  Buffer.from(provided, 'base64'))` in Node, or `hmac.compare_digest(expected,
  provided)` in Python.
matcher: null
predicate: square-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://developer.squareup.com/docs/webhooks/step3validate
