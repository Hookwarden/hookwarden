schema_version: 1
rule_id: intercom/raw-body-misuse
provider: intercom
severity: critical
emits_state: not-verified
message: |
  Intercom webhook handler reads the X-Hub-Signature header (or computes
  manual HMAC) but does not appear to receive the request body as raw bytes.
  Intercom's HMAC is computed over the raw payload — once `express.json()`
  (or any other JSON middleware) parses the body, the bytes used for the
  HMAC differ from what was sent and verification fails on every webhook
  delivery.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  Intercom webhook route only, or capture the raw body via a custom
  `verify` callback before JSON parsing. PHP: read `php://input` before
  any framework body parsing.
matcher: null
predicate: intercom-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.intercom.com/docs/references/rest-api/webhooks/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://docs.stripe.com/webhooks#verify-events
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
