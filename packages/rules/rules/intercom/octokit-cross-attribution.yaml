schema_version: 1
rule_id: intercom/octokit-cross-attribution
provider: intercom
severity: critical
emits_state: not-verified
message: |
  This Intercom webhook handler imports `@octokit/webhooks` (or
  `@octokit/webhooks-methods`). Intercom re-uses GitHub's `X-Hub-Signature`
  header name, but `@octokit/webhooks` validates the signature against the
  configured GitHub webhook secret — NOT the Intercom secret.

  Failure modes:
    - If a GitHub secret IS configured: every Intercom delivery is rejected
      because the Intercom HMAC won't match the GitHub secret.
    - If no GitHub secret is configured (or if the GitHub secret happens to
      equal the Intercom secret), verification appears to succeed for the
      wrong reason — silently masking a verification bypass.

  Fix: do NOT use `@octokit/webhooks` for Intercom. Verify Intercom signatures
  with a dedicated path that hashes the raw body with the Intercom client
  secret:
    `crypto.createHmac('sha256', INTERCOM_CLIENT_SECRET).update(rawBody).digest('hex')`
  then constant-time compare against the `X-Hub-Signature` header (strip the
  `sha1=` / `sha256=` prefix if present).
matcher: null
predicate: intercom-octokit-cross-attribution
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://developers.intercom.com/docs/build-an-integration/learn-more/webhooks/signature/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://cwe.mitre.org/data/definitions/345.html
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Replace @octokit/webhooks with an Intercom-secret-keyed HMAC verification path"
  codegen: null
