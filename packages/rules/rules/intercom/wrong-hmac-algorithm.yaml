schema_version: 1
rule_id: intercom/wrong-hmac-algorithm
provider: intercom
severity: high
emits_state: not-verified
message: |
  Intercom webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. Modern Intercom signs requests with
  HMAC-SHA256 and hex encoding under `X-Hub-Signature: sha256=...`. Legacy
  Intercom integrations shipped HMAC-SHA1 — a 2026 codebase still using
  `sha1` for Intercom is a real bug, not just legacy compatibility:
  signatures generated by current Intercom infrastructure will never match.

  Fix: `crypto.createHmac('sha256', clientSecret)` (Node),
  `hmac.new(client_secret.encode(), raw_body, hashlib.sha256)` (Python), or
  `hash_hmac('sha256', $rawBody, $secret)` (PHP).
matcher: null
predicate: intercom-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.intercom.com/docs/references/rest-api/webhooks/
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
