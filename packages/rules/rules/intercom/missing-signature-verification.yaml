schema_version: 1
rule_id: intercom/missing-signature-verification
provider: intercom
severity: critical
emits_state: not-verified
message: |
  Intercom webhook handler does not appear to verify the X-Hub-Signature
  header before processing the request. Intercom re-uses GitHub's
  X-Hub-Signature header name but has no canonical first-party webhook SDK —
  verification is documented as inline HMAC-SHA256 over the raw request body,
  hex-encoded with `sha256=` prefix, compared with `crypto.timingSafeEqual`.
  No such verification path was detected reachable from this handler.

  Fix: compute `'sha256=' + crypto.createHmac('sha256', clientSecret).update(rawBody).digest('hex')`
  (Node), `'sha256=' + hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python), or `'sha256=' . hash_hmac('sha256', $rawBody, $secret)` (PHP), then
  constant-time-compare against `X-Hub-Signature`.
matcher: null
predicate: intercom-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.intercom.com/docs/references/rest-api/webhooks/
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
