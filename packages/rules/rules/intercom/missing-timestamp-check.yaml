schema_version: 1
rule_id: intercom/missing-timestamp-check
provider: intercom
severity: high
emits_state: manual-review
message: |
  Intercom webhook handler computes HMAC manually but no timestamp tolerance
  check is reachable from the handler. Intercom does not send a dedicated
  timestamp header — applications must dedupe by `X-Intercom-Topic` +
  Intercom-supplied delivery IDs or by webhook event ID to avoid indefinite
  replays of a captured signed delivery.

  Recommended: extract a delivery identifier from the request body or
  headers, persist it (e.g. Redis SETNX with TTL of ~10 minutes), and reject
  any request whose identifier has already been processed.
matcher: null
predicate: intercom-missing-timestamp-check
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.intercom.com/docs/references/rest-api/webhooks/
references:
  - https://docs.stripe.com/webhooks#replay-attacks
  - https://www.standardwebhooks.com/
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
