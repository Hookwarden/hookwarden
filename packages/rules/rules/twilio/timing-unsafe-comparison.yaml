schema_version: 1
rule_id: twilio/timing-unsafe-comparison
provider: twilio
severity: critical
emits_state: not-verified
message: |
  Twilio webhook handler computes an HMAC-SHA1 manually but does not call
  `crypto.timingSafeEqual` (Node) or `hmac.compare_digest` (Python) for
  signature comparison. Plain `==` / `===` against a base64 HMAC string leaks
  timing information.

  Fix: compare via `crypto.timingSafeEqual(Buffer.from(expected, 'base64'),
  Buffer.from(provided, 'base64'))` in Node, or `hmac.compare_digest(expected,
  provided)` in Python.
matcher: null
predicate: twilio-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.twilio.com/docs/usage/webhooks/webhooks-security
references:
  - https://codahale.com/a-lesson-in-timing-attacks/
  - https://cwe.mitre.org/data/definitions/208.html
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
