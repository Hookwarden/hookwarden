schema_version: 1
rule_id: twilio/unreachable-verification
provider: twilio
severity: high
emits_state: manual-review
message: |
  Twilio webhook handler imports `twilio` but `twilio.validateRequest` /
  `RequestValidator.validate` is not reachable from the handler entry within
  3 hops. The verification call may be conditional, dynamically dispatched,
  or in dead code — static analysis cannot determine whether every request
  goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken.
matcher: null
predicate: twilio-unreachable-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.twilio.com/docs/usage/webhooks/webhooks-security
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
