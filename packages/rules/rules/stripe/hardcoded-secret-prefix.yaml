schema_version: 1
rule_id: stripe/hardcoded-secret-prefix
provider: stripe
severity: critical
emits_state: not-verified
message: |
  A literal value matching the Stripe webhook signing-secret prefix
  (`whsec_*`) appears in source code. Hardcoded secrets land in git history,
  build artefacts, and Docker images — once committed, they must be rotated.

  Fix: read `process.env.STRIPE_WEBHOOK_SECRET` (or the Python equivalent)
  and rotate the leaked secret in the Stripe Dashboard under
  Developers → Webhooks → your endpoint → "Roll secret".
matcher:
  name: secretLiteralPrefix
  args:
    prefix: whsec_
predicate: null
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://stripe.com/docs/webhooks/signatures
path_severity_overrides:
  - patterns:
      - "**/__tests__/**"
      - "**/fixtures/**"
      - "**/examples/**"
      - "**/*.example.*"
      - "**/*.test.{js,ts,py}"
      - "**/*.spec.{js,ts,py}"
    severity: info
