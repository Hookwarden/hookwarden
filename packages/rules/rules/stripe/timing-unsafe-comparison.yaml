schema_version: 1
rule_id: stripe/timing-unsafe-comparison
provider: stripe
severity: critical
emits_state: not-verified
message: |
  Stripe webhook handler computes an HMAC manually but does not call
  `crypto.timingSafeEqual` (Node) or `hmac.compare_digest` (Python) for
  signature comparison. Plain `==` / `===` against an HMAC buffer leaks
  timing information and is exploitable on a fast network.

  Fix: replace `expected === provided` with
  `crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(provided))` in
  Node, or `hmac.compare_digest(expected, provided)` in Python.
matcher: null
predicate: stripe-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://stripe.com/docs/webhooks/signatures
