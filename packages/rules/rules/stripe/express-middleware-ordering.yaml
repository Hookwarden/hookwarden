schema_version: 1
rule_id: stripe/express-middleware-ordering
provider: stripe
severity: critical
emits_state: not-verified
message: |
  Express webhook handler for Stripe has `express.json()` (or
  `body-parser.json()`) registered before the webhook route. JSON middleware
  consumes the request body; by the time the Stripe handler runs, the raw
  bytes used for HMAC are gone and `stripe.webhooks.constructEvent` cannot
  reproduce the signature.

  Fix: register `express.json()` AFTER the webhook route, OR mount
  `express.raw({ type: 'application/json' })` only on the webhook path.
matcher: null
predicate: express-middleware-ordering
applies_to:
  - express
provider_docs_url: https://stripe.com/docs/webhooks/signatures
references:
  - https://expressjs.com/en/guide/using-middleware.html
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
