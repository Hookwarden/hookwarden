schema_version: 1
rule_id: stripe/unreachable-verification
provider: stripe
severity: high
emits_state: manual-review
message: |
  Stripe webhook handler imports the `stripe` SDK but
  `stripe.webhooks.constructEvent` is not reachable from the handler entry
  within 3 hops. The verification call may be conditional, dynamically
  dispatched, or in dead code — static analysis cannot determine whether
  every request goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken.
matcher: null
predicate: stripe-unreachable-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://stripe.com/docs/webhooks/signatures
