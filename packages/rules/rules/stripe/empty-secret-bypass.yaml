schema_version: 1
rule_id: stripe/empty-secret-bypass
provider: stripe
severity: critical
emits_state: not-verified
message: |
  CVE-2026-41432: this Stripe webhook handler passes an empty-string secret
  (or a fallback that evaluates to `''`) into `stripe.webhooks.constructEvent`.
  HMAC-SHA256 over an empty key matches a forged signature an attacker
  computes with the same empty key — the call SUCCEEDS for any payload
  and the handler accepts unauthenticated webhook events.

  Detected variant(s):
    - `secret || ''`            (logical-OR fallback to empty)
    - `secret ?? ''`            (nullish-coalescing fallback to empty)
    - `secret ? secret : ''`    (ternary fallback to empty)
    - `constructEvent(b, s, '')` (explicit empty-string literal at the secret arg)

  Fix: refuse to call constructEvent without a non-empty signing secret.
  Validate the env var at boot:

      const STRIPE_WEBHOOK_SECRET = process.env.STRIPE_WEBHOOK_SECRET;
      if (!STRIPE_WEBHOOK_SECRET) {
        throw new Error("STRIPE_WEBHOOK_SECRET is required");
      }
      // ... then call constructEvent(rawBody, signature, STRIPE_WEBHOOK_SECRET)

  Plan 17 partial coverage notes: variants 4 (missing nullish guard) +
  5 (optional chaining) + Python + PHP coverage are deferred to Plan 17b.
  This rule fires today on JS/TS Babel-parsed sources for variants 1, 2,
  3, and 6 (the literal CVE-2026-41432 repro shape).
matcher: null
predicate: stripe-empty-secret-bypass
applies_to:
  - express
