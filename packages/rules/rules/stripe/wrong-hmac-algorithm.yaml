schema_version: 1
rule_id: stripe/wrong-hmac-algorithm
provider: stripe
severity: critical
emits_state: not-verified
message: |
  Stripe webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. Stripe signs webhook payloads with
  HMAC-SHA256 — any other algorithm (MD5, SHA-1, SHA-384, SHA-512,
  RIPEMD-160) will never match, so verification cannot succeed.

  Fix: `crypto.createHmac('sha256', secret)` (Node) or
  `hmac.new(secret, msg, hashlib.sha256)` (Python).
matcher: null
predicate: stripe-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://stripe.com/docs/webhooks/signatures
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
