schema_version: 1
rule_id: stripe/missing-signature-verification
provider: stripe
severity: critical
emits_state: not-verified
message: |
  Stripe webhook handler does not appear to verify the signature header before
  processing the event. Neither `stripe.webhooks.constructEvent` (Node SDK)
  nor `stripe.Webhook.construct_event` (Python SDK) is reachable from this
  handler within 3 hops, and no manual HMAC path was detected either.

  Stripe docs: "You should always verify events by checking the signature".

  Fix: pass the raw request body, the `Stripe-Signature` header, and your
  `STRIPE_WEBHOOK_SECRET` to `stripe.webhooks.constructEvent` (Node) or
  `stripe.Webhook.construct_event` (Python) at the very top of the handler.
matcher: null
predicate: stripe-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://stripe.com/docs/webhooks
