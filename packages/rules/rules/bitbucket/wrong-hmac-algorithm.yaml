schema_version: 1
rule_id: bitbucket/wrong-hmac-algorithm
provider: bitbucket
severity: critical
emits_state: not-verified
message: |
  Bitbucket Cloud webhook handler uses a manual HMAC path but the algorithm
  in use appears to be other than HMAC-SHA256. Bitbucket Cloud signs
  requests with HMAC-SHA256 and hex encoding (header value `sha256=<hex>`)
  — any other algorithm (MD5, SHA-1, SHA-384, SHA-512) will never match,
  so verification cannot succeed.

  Fix: `crypto.createHmac('sha256', secret)` (Node),
  `hmac.new(secret.encode(), raw_body, hashlib.sha256)` (Python),
  or `hash_hmac('sha256', $rawBody, $secret)` (PHP).
matcher: null
predicate: bitbucket-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://support.atlassian.com/bitbucket-cloud/docs/manage-webhooks/
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
