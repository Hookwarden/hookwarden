schema_version: 1
rule_id: bitbucket/raw-body-misuse
provider: bitbucket
severity: critical
emits_state: not-verified
message: |
  Bitbucket Cloud webhook handler reads the `X-Hub-Signature` header (or
  computes manual HMAC) but does not appear to receive the request body as
  raw bytes. Bitbucket's HMAC is computed over the raw payload — once
  `express.json()` (or any other JSON middleware) parses the body, the
  bytes used for the HMAC differ from what was sent and verification fails
  on every webhook delivery.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  Bitbucket webhook route only, or capture the raw body via a custom
  `verify` callback before JSON parsing. PHP: read `php://input` before
  any framework body parsing.
matcher: null
predicate: bitbucket-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://support.atlassian.com/bitbucket-cloud/docs/manage-webhooks/
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
