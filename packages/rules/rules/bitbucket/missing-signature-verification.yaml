schema_version: 1
rule_id: bitbucket/missing-signature-verification
provider: bitbucket
severity: critical
emits_state: not-verified
message: |
  Bitbucket Cloud webhook handler does not appear to verify the
  `X-Hub-Signature` header before processing the request. Bitbucket Cloud
  has no canonical first-party webhook SDK — verification is documented as
  inline HMAC-SHA256 over the raw request body, hex-encoded, with the
  `sha256=` prefix. No such verification path was detected reachable from
  this handler.

  Note: Bitbucket Cloud's signature header value is `sha256=<hex>` — strip
  the `sha256=` prefix before comparing against your computed HMAC (see
  `bitbucket/signature-prefix-not-stripped`).

  Fix: extract the hex portion (after the `sha256=` prefix) from
  `X-Hub-Signature`, then constant-time-compare against
  `crypto.createHmac('sha256', secret).update(rawBody).digest('hex')` (Node)
  or `hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python) or `hash_hmac('sha256', $rawBody, $secret)` (PHP).
matcher: null
predicate: bitbucket-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://support.atlassian.com/bitbucket-cloud/docs/manage-webhooks/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
