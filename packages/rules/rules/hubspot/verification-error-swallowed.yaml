schema_version: 1
rule_id: hubspot/verification-error-swallowed
provider: hubspot
severity: high
emits_state: not-verified
message: |
  Hubspot webhook handler wraps the verification call in a try/catch
  whose catch handler does NOT terminate execution. The SDK verify call
  throws on invalid signatures, but the handler proceeds anyway — an
  attacker who forges a payload will trigger the throw, get caught, and
  see the handler complete normally.

  Defensible catch handlers MUST do one of:
    - rethrow (`throw err`)
    - return a 4xx/5xx response
    - call `next(err)` (Express)
    - call `process.exit` / `process.abort`

  This rule does NOT fire when the catch handler matches any of the above.
  Reference: Clerk JavaScript GHSA-9mp4-77wg-rwx9.
matcher: null
predicate: hubspot-verification-error-swallowed
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://developers.hubspot.com/docs/api/webhooks/validating-requests
references:
  - https://github.com/clerk/javascript/security/advisories/GHSA-9mp4-77wg-rwx9
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
compliance_mappings:
  soc2_cc: ["CC7.1", "CC7.2"]
  iso27001: ["A.8.24", "A.8.16"]
  eu_ai_act_annex_iii: ["Art.12", "Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Add a terminating action to the catch block (rethrow, return 4xx, next(err), or process.exit) — see provider_docs_url"
  codegen: null
