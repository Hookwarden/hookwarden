schema_version: 1
rule_id: hubspot/missing-signature-verification
provider: hubspot
severity: critical
emits_state: not-verified
message: |
  HubSpot v3 webhook handler does not appear to verify the
  `X-HubSpot-Signature-v3` header before processing the request. HubSpot
  v3 signs the canonical string
  `${httpMethod}${requestURI}${rawBody}${timestamp}` with HMAC-SHA256,
  base64-encoded. No such verification path was detected reachable from
  this handler.

  Fix: build the canonical string with `httpMethod + requestURI + rawBody + timestamp`
  in that exact order, then compute
  `crypto.createHmac('sha256', clientSecret).update(canonicalString).digest('base64')`
  (Node) and constant-time-compare against `X-HubSpot-Signature-v3`.
matcher: null
predicate: hubspot-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.hubspot.com/docs/api/webhooks/validating-requests
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
