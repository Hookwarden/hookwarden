schema_version: 1
rule_id: hubspot/wrong-hmac-algorithm
provider: hubspot
severity: critical
emits_state: not-verified
message: |
  HubSpot v3 webhook handler uses a manual HMAC path but the algorithm
  in use appears to be other than HMAC-SHA256. HubSpot v3 signs requests
  with HMAC-SHA256 and base64 encoding — any other algorithm (MD5, SHA-1,
  SHA-384, SHA-512) will never match, so verification cannot succeed. The
  legacy v1 / v2 signature schemes (sha256 over body-only and over
  client-secret+body) are also not compatible with the v3 endpoint and
  must NOT be used for the v3 header.

  Fix: `crypto.createHmac('sha256', clientSecret)` (Node),
  `hmac.new(client_secret.encode(), canonical_string.encode(), hashlib.sha256)`
  (Python), or `hash_hmac('sha256', $canonicalString, $secret, true)`
  (PHP — note the binary-output flag is required before base64-encoding).
matcher: null
predicate: hubspot-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.hubspot.com/docs/api/webhooks/validating-requests
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
