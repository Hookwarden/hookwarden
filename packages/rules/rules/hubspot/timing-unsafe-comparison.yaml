schema_version: 1
rule_id: hubspot/timing-unsafe-comparison
provider: hubspot
severity: critical
emits_state: not-verified
message: |
  HubSpot v3 webhook handler computes HMAC-SHA256 manually but does not
  call `crypto.timingSafeEqual` (Node), `hmac.compare_digest` (Python),
  or `hash_equals` (PHP) for the base64 signature comparison. Plain `==`
  / `===` against the base64 HMAC string leaks timing information that
  lets an attacker bisect the signature byte-by-byte over many requests.

  Fix: compare via
  `crypto.timingSafeEqual(Buffer.from(expected, 'base64'), Buffer.from(provided, 'base64'))`
  in Node, `hmac.compare_digest(expected, provided)` in Python, or
  `hash_equals($expected, $provided)` in PHP.
matcher: null
predicate: hubspot-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.hubspot.com/docs/api/webhooks/validating-requests
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
