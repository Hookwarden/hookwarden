schema_version: 1
rule_id: n8n/hardcoded-secret-prefix
provider: n8n
severity: critical
emits_state: not-verified
message: |
  A literal value matching an n8n API-key prefix (`n8n_api_`) appears in
  source code. Hardcoded secrets land in git history, build artefacts, and
  Docker images — once committed, they must be rotated.

  Fix: read the credential from an environment variable (or n8n's encrypted
  credential store) instead of a source-code literal, and rotate the leaked
  key in n8n Settings → API.
matcher:
  name: secretLiteralPrefix
  args:
    prefix: n8n_api_
predicate: null
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.n8n.io/api/authentication/
references:
  - https://blog.talosintelligence.com/the-n8n-n8mare/
  - https://cwe.mitre.org/data/definitions/798.html
path_severity_overrides:
  - patterns:
      - "**/__tests__/**"
      - "**/fixtures/**"
      - "**/examples/**"
      - "**/*.example.*"
      - "**/*.test.{js,ts,py}"
      - "**/*.spec.{js,ts,py}"
    severity: info
fix:
  safety: manual-only
  description: "Read the credential from env/credential store and rotate the leaked key — see provider_docs_url"
  codegen: null
