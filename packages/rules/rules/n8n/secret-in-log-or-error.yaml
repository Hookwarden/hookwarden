schema_version: 1
rule_id: n8n/secret-in-log-or-error
provider: n8n
severity: high
emits_state: not-verified
message: |
  n8n custom-node webhook handler logs or throws an error containing the
  webhook secret / credential as a value (e.g. `console.log(secret)`,
  `throw new Error(`secret=${secret}`)`). When log storage (CloudWatch,
  Datadog, Sentry) is compromised, every secret in those logs goes with it.

  Defensible patterns (silent):
    - `console.log(!!secret)` / `Boolean(secret)` — boolean only
    - `console.log(secret.length)` — length only
    - `createHmac('sha256', secret).digest('hex')` — hashed
    - `secret.slice(0, 4)` (≤8 chars) — manual-review

  Fix: never log or throw the secret value. Log a derived non-reversible
  signal (boolean, length, or hash). Audit existing log destinations and
  rotate the secret if it ever shipped.
matcher: null
predicate: n8n-secret-in-log-or-error
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://docs.n8n.io/api/authentication/
references:
  - https://blog.talosintelligence.com/the-n8n-n8mare/
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.6"]
  iso27001: ["A.8.10", "A.8.12", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.12"]
  nist_ai_rmf: ["GOVERN", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: manual-only
  description: "Replace secret-in-log with a derived non-reversible signal (boolean, length, hash); rotate the secret if it ever shipped — see provider_docs_url"
  codegen: null
