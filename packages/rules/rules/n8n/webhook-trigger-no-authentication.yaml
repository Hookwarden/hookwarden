schema_version: 1
rule_id: n8n/webhook-trigger-no-authentication
provider: n8n
severity: critical
emits_state: not-verified
message: |
  n8n Webhook trigger node is exposed without authentication
  (`Authentication: None`, or the `authentication` parameter is absent —
  n8n's UI default). Any party can POST arbitrary JSON to this workflow's
  public webhook URL, and every downstream node (including AI Agent / tool
  nodes) acts on that attacker-controlled payload.

  This is the entry point of the Cisco Talos "n8n n8mare" agentic-callback
  attack surface: an unauthenticated public webhook feeding an automation
  graph.

  Fix: set the Webhook node's `Authentication` to `Header Auth` (or
  `Basic Auth` / `JWT Auth`) and attach the matching credential, so only
  callers presenting the configured secret reach the workflow.
matcher: null
predicate: n8n-trigger-no-auth
applies_to:
  - n8n-workflow
provider_docs_url: https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.webhook/
references:
  - https://blog.talosintelligence.com/the-n8n-n8mare/
  - https://thehackernews.com/2026/04/n8n-webhooks-abused-since-october-2025.html
compliance_mappings:
