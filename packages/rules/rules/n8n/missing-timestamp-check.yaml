schema_version: 1
rule_id: n8n/missing-timestamp-check
provider: n8n
severity: high
emits_state: manual-review
message: |
  n8n custom-node webhook handler computes an HMAC over the request but no
  replay-defense surface (timestamp tolerance check, or per-delivery nonce/ID
  lookup against a Map, Set, Redis, or DB) is reachable. A captured request
  can be replayed against the workflow.

  Recommended: reject requests whose timestamp is outside a short tolerance
  window, or persist and reject previously-seen delivery IDs.
matcher: null
predicate: n8n-missing-timestamp-check
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://docs.n8n.io/integrations/creating-nodes/build/reference/http-helpers/
references:
  - https://blog.talosintelligence.com/the-n8n-n8mare/
  - https://www.standardwebhooks.com/
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: manual-only
  description: "Add a timestamp-tolerance check or per-delivery replay defense — see provider_docs_url"
  codegen: null
