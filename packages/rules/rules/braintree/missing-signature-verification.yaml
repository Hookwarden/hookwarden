schema_version: 1
rule_id: braintree/missing-signature-verification
provider: braintree
severity: critical
emits_state: not-verified
message: |
  Braintree webhook handler does not appear to verify the notification
  before processing it. Braintree delivers webhooks as the form fields
  `bt_signature` and `bt_payload`; the payload is only trustworthy after the
  SDK's `parse` call checks the signature against your API keys and throws
  `InvalidSignature` on mismatch. No such call was detected reachable from
  this handler — decoding `bt_payload` directly (it is plain base64 XML) lets
  anyone who knows the URL forge subscription or dispute events.

  Fix: `await gateway.webhookNotification.parse(req.body.bt_signature, req.body.bt_payload)`
  (Node), `gateway.webhook_notification.parse(request.form["bt_signature"], request.form["bt_payload"])`
  (Python), or `$gateway->webhookNotification()->parse($_POST['bt_signature'], $_POST['bt_payload'])`
  (PHP), and act only on the returned notification.
matcher: null
predicate: braintree-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.paypal.com/braintree/docs/guides/webhooks/parse
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
