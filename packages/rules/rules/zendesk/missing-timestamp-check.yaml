schema_version: 1
rule_id: zendesk/missing-timestamp-check
provider: zendesk
severity: high
emits_state: manual-review
message: |
  Zendesk webhook handler computes HMAC manually but no timestamp tolerance
  check is reachable from the handler. Zendesk signs
  `${X-Zendesk-Webhook-Signature-Timestamp}${rawBody}` — without rejecting
  deliveries whose timestamp is outside a tolerance window (Zendesk docs
  recommend ~5 minutes), an attacker who captures one signed webhook can
  replay it indefinitely.

  Fix: read `X-Zendesk-Webhook-Signature-Timestamp`, parse to integer, and
  reject any request where `Math.abs(Date.now() / 1000 - ts) > 300` (Node)
  or `abs(time.time() - int(ts)) > 60 * 5` (Python).
matcher: null
predicate: zendesk-missing-timestamp-check
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.zendesk.com/documentation/event-connectors/webhooks/verifying/
references:
  - https://docs.stripe.com/webhooks#replay-attacks
  - https://www.standardwebhooks.com/
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
