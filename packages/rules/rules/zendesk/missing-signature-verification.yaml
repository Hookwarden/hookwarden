schema_version: 1
rule_id: zendesk/missing-signature-verification
provider: zendesk
severity: critical
emits_state: not-verified
message: |
  Zendesk webhook handler does not appear to verify the
  X-Zendesk-Webhook-Signature header before processing the request.
  Zendesk has no canonical first-party webhook SDK — verification is
  documented as inline HMAC-SHA256 over
  `${X-Zendesk-Webhook-Signature-Timestamp}${rawBody}`, base64-encoded,
  compared with `crypto.timingSafeEqual`. No such manual HMAC path was
  detected reachable from this handler.

  Fix: compute `crypto.createHmac('sha256', signingSecret).update(ts + rawBody).digest('base64')`
  (Node) or `base64.b64encode(hmac.new(secret.encode(), (ts + body).encode(), hashlib.sha256).digest())`
  (Python) and constant-time-compare against the header. PHP: `hash_hmac('sha256', $ts . $body, $secret, true)`
  base64-encoded, then `hash_equals()`.
matcher: null
predicate: zendesk-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.zendesk.com/documentation/event-connectors/webhooks/verifying/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
