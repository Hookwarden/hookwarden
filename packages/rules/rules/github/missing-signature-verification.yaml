schema_version: 1
rule_id: github/missing-signature-verification
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook handler does not appear to verify the
  `X-Hub-Signature-256` header. Neither `@octokit/webhooks` `verify`
  nor a manual `crypto.createHmac('sha256', secret)` path is reachable
  from this handler within 3 hops.

  GitHub docs: "When your secret is set, GitHub uses it to create a hash
  signature with each payload."

  Fix: use `@octokit/webhooks` to verify, or compute
  `crypto.createHmac('sha256', secret).update(rawBody).digest('hex')` and
  compare against `X-Hub-Signature-256` with `crypto.timingSafeEqual`.
matcher: null
predicate: github-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
