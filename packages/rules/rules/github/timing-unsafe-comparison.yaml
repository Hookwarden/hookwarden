schema_version: 1
rule_id: github/timing-unsafe-comparison
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook handler does not call `crypto.timingSafeEqual` (Node) or
  `hmac.compare_digest` (Python) and is not using `@octokit/webhooks` for
  verification. A plain `==` / `===` comparison against the HMAC buffer
  leaks timing information.

  Fix: replace `expected === provided` with
  `crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(provided))`.
matcher: null
predicate: github-timing-safe-equal
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
