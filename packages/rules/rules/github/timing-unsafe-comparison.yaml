schema_version: 1
rule_id: github/timing-unsafe-comparison
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook handler does not call `crypto.timingSafeEqual` (Node) or
  `hmac.compare_digest` (Python) and is not using `@octokit/webhooks` for
  verification. A plain `==` / `===` comparison against the HMAC buffer
  leaks timing information.

  Fix: replace `expected === provided` with
  `crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(provided))`.
matcher: null
predicate: github-timing-safe-equal
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
references:
  - https://codahale.com/a-lesson-in-timing-attacks/
  - https://cwe.mitre.org/data/definitions/208.html
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
