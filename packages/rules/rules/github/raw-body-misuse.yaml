schema_version: 1
rule_id: github/raw-body-misuse
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook handler reads the signature header but does not appear
  to receive the request body as raw bytes. The HMAC-SHA256 GitHub signs
  is computed over the exact bytes sent — once Express's `express.json()`
  parses the payload, the bytes used for the HMAC differ.

  Fix: apply `express.raw({ type: 'application/json' })` to the GitHub
  webhook route only, or use `@octokit/webhooks` which handles this for you.
matcher: null
predicate: github-raw-body-misuse
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://docs.stripe.com/webhooks#verify-events
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
