schema_version: 1
rule_id: github/missing-replay-defense
provider: github
severity: high
emits_state: manual-review
message: |
  GitHub webhook handler computes HMAC manually but no replay-defense
  surface (per-delivery `X-GitHub-Delivery` UUID lookup against a Map,
  Set, Redis, or DB) is reachable. GitHub does not include a timestamp
  inside its signature header — replay defense relies on persisting and
  rejecting previously-seen delivery IDs.

  Recommended: store recent `X-GitHub-Delivery` UUIDs (with TTL, e.g. 24 h)
  and reject duplicates.
matcher: null
predicate: github-missing-timestamp-check
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
references:
  - https://docs.stripe.com/webhooks#replay-attacks
  - https://www.standardwebhooks.com/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
