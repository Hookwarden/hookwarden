schema_version: 1
rule_id: github/test-mode-bypass
provider: github
severity: high
emits_state: not-verified
message: |
  Github webhook handler short-circuits on a dev-mode env check
  (e.g. `process.env.NODE_ENV !== 'production'` or
  `process.env.SKIP_VERIFICATION`) and returns a SUCCESS response BEFORE
  any signature verification runs. This is unsafe even in development —
  if the env var gets clobbered or the bypass ships unintentionally to
  production, attackers can POST forged payloads and trigger the
  short-circuit instead of being rejected.

  Fix: remove the dev-mode bypass entirely, OR gate the bypass on a
  PRODUCTION-checked positive condition (`process.env.ALLOW_DEV_BYPASS === '1'`)
  and ensure the env never leaks into production builds.
matcher: null
predicate: github-test-mode-bypass
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/best-practices-for-using-webhooks
references:
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
  - https://owasp.org/www-project-top-ten/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.8"]
  iso27001: ["A.8.24", "A.8.31"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MAP", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Remove the dev-mode bypass OR gate on a positive prod-checked condition — see provider_docs_url"
  codegen: null
