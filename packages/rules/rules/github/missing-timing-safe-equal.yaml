schema_version: 1
rule_id: github/missing-timing-safe-equal
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook handler does not appear to call `crypto.timingSafeEqual` or
  the `@octokit/webhooks` verifier within 3 hops of the route. Signature
  verification is missing or unresolvable from static analysis. Add the
  Octokit SDK call or use `crypto.timingSafeEqual` after computing HMAC-SHA256.
matcher: null
predicate: github-timing-safe-equal
applies_to:
  - express
  - hono
  - fastify
  - nextjs
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
references:
  - https://codahale.com/a-lesson-in-timing-attacks/
  - https://cwe.mitre.org/data/definitions/208.html
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
