schema_version: 1
rule_id: github/hardcoded-secret-prefix
provider: github
severity: critical
emits_state: not-verified
message: |
  A literal value matching a GitHub credential prefix (`ghs_*`,
  `github_pat_*`) appears in source code. Hardcoded secrets land in git
  history, build artefacts, and Docker images — once committed, they
  must be rotated.

  Fix: read `process.env.GITHUB_WEBHOOK_SECRET` (or equivalent) and
  rotate the leaked credential in your GitHub App settings or under
  Settings → Developer settings → Personal access tokens.
matcher:
  name: secretLiteralPrefix
  args:
    prefix: ghs_
predicate: null
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
path_severity_overrides:
  - patterns:
      - "**/__tests__/**"
      - "**/fixtures/**"
      - "**/examples/**"
      - "**/*.example.*"
      - "**/*.test.{js,ts,py}"
      - "**/*.spec.{js,ts,py}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
