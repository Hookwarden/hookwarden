schema_version: 1
rule_id: github/wrong-hmac-algorithm
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook signature header is `X-Hub-Signature-256` (SHA-256). A
  manual HMAC path appears to use a different algorithm (MD5, SHA-1,
  SHA-512). Comparison will never succeed against the SHA-256 digest
  GitHub sends.

  Fix: `crypto.createHmac('sha256', secret)` (Node) or
  `hmac.new(secret, msg, hashlib.sha256)` (Python).
matcher: null
predicate: github-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
