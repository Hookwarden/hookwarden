schema_version: 1
rule_id: github/wrong-hmac-algorithm
provider: github
severity: critical
emits_state: not-verified
message: |
  GitHub webhook signature header is `X-Hub-Signature-256` (SHA-256). A
  manual HMAC path appears to use a different algorithm (MD5, SHA-1,
  SHA-512). Comparison will never succeed against the SHA-256 digest
  GitHub sends.

  Fix: `crypto.createHmac('sha256', secret)` (Node) or
  `hmac.new(secret, msg, hashlib.sha256)` (Python).
matcher: null
predicate: github-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
