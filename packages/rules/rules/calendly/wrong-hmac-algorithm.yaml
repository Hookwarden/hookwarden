schema_version: 1
rule_id: calendly/wrong-hmac-algorithm
provider: calendly
severity: critical
emits_state: not-verified
message: |
  Calendly webhook handler uses a manual HMAC path but the algorithm in
  use appears to be other than HMAC-SHA256. Calendly signs requests with
  HMAC-SHA256 and hex encoding — any other algorithm (MD5, SHA-1,
  SHA-384, SHA-512) will never match, so verification cannot succeed.

  Fix: `crypto.createHmac('sha256', signingSecret)` (Node),
  `hmac.new(signing_secret.encode(), msg, hashlib.sha256)` (Python), or
  `hash_hmac('sha256', $msg, $secret)` (PHP — note the binary-output flag
  is required if you base64-encode the result).
matcher: null
predicate: calendly-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.calendly.com/api-docs/EVHvthYDg5Bnc-webhook-signatures
fix:
