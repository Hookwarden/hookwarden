schema_version: 1
rule_id: calendly/missing-signature-verification
provider: calendly
severity: critical
emits_state: not-verified
message: |
  Calendly webhook handler does not appear to verify the
  `Calendly-Webhook-Signature` header before processing the request.
  Calendly signs requests with HMAC-SHA256 over `${timestamp}.${rawBody}`
  (the Slack signing recipe) and the header value is comma-separated
  `t=<unix-timestamp>,v1=<hex-hmac>` (the Stripe header shape).

  Fix: parse `Calendly-Webhook-Signature` into its `t=` and `v1=` components,
  compute
  `crypto.createHmac('sha256', signingSecret).update(\`\${t}.\${rawBody}\`).digest('hex')`
  (Node) or `hmac.new(secret.encode(), f"{t}.".encode() + raw_body, hashlib.sha256).hexdigest()`
  (Python) or the PHP equivalent, then constant-time compare against the
  `v1=` value.
matcher: null
predicate: calendly-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.calendly.com/api-docs/EVHvthYDg5Bnc-webhook-signatures
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
