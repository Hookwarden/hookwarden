schema_version: 1
rule_id: calendly/signature-header-parse-mishandled
provider: calendly
severity: critical
emits_state: manual-review
message: |
  Calendly's `Calendly-Webhook-Signature` header is comma-separated
  `t=<unix-timestamp>,v1=<hex-hmac>` (the Stripe header shape). The
  handler MUST extract `t=` and `v1=` from the header before computing
  HMAC over `${t}.${rawBody}` and constant-time-comparing against `v1`.

  This handler does manual HMAC AND reads the signature header, but no
  string-manipulation symbol (.split / .substring / .substr / .slice /
  .replace / .match / .startsWith / .indexOf / .forEach / .map / .find /
  strpos / substr / str_replace / preg_split / preg_match / explode /
  str_getcsv) is reachable from the handler entry. Most likely failure
  modes:
    - Handler compares the full `t=...,v1=...` header value against bare
      HMAC hex — fails every delivery.
    - Handler hashes only the raw body (forgetting the `${t}.` prefix) —
      fails every delivery.
    - Handler reads the header but never split-parses it — the timestamp
      and v1 are wrong or undefined.

  Fix: extract `t` and `v1` from the comma-separated header via
  `.split(',').reduce(...)` (Node) or `dict(p.split('=') for p in header.split(','))`
  (Python) or `explode(',', $header)` (PHP). Compute HMAC over
  `${t}.${rawBody}` and constant-time compare against the extracted `v1` hex.
matcher: null
predicate: calendly-signature-header-parse-mishandled
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.calendly.com/api-docs/EVHvthYDg5Bnc-webhook-signatures
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://cwe.mitre.org/data/definitions/345.html
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Split the Calendly-Webhook-Signature header on `,` into t= and v1= components before HMAC verification"
  codegen: null
