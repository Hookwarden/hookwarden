schema_version: 1
rule_id: calendly/raw-body-misuse
provider: calendly
severity: critical
emits_state: not-verified
message: |
  Calendly webhook handler reads the `Calendly-Webhook-Signature` header
  (or computes manual HMAC) but does not appear to receive the request
  body as raw bytes. Calendly's HMAC is computed over `${timestamp}.${rawBody}`
  — once `express.json()` (or any other JSON middleware) parses the body,
  the bytes used for the HMAC differ from what was sent and verification
  fails on every webhook delivery.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  Calendly webhook route only, or capture the raw body via a custom
  `verify` callback before JSON parsing. PHP: read `php://input` before
  any framework body parsing.
matcher: null
predicate: calendly-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.calendly.com/api-docs/EVHvthYDg5Bnc-webhook-signatures
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://docs.stripe.com/webhooks#verify-events
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
