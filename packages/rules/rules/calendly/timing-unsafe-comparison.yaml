schema_version: 1
rule_id: calendly/timing-unsafe-comparison
provider: calendly
severity: critical
emits_state: not-verified
message: |
  Calendly webhook handler computes HMAC-SHA256 manually but does not
  call `crypto.timingSafeEqual` (Node), `hmac.compare_digest` (Python),
  or `hash_equals` (PHP) for the hex signature comparison. Plain `==` /
  `===` against the hex HMAC string leaks timing information that lets
  an attacker bisect the signature byte-by-byte over many requests.

  Fix: compare via
  `crypto.timingSafeEqual(Buffer.from(expected, 'utf8'), Buffer.from(provided, 'utf8'))`
  in Node, `hmac.compare_digest(expected, provided)` in Python, or
  `hash_equals($expected, $provided)` in PHP.
matcher: null
predicate: calendly-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developer.calendly.com/api-docs/EVHvthYDg5Bnc-webhook-signatures
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
