schema_version: 1
rule_id: shopify/timing-unsafe-comparison
provider: shopify
severity: critical
emits_state: not-verified
message: |
  Shopify webhook handler computes an HMAC manually but does not call
  `crypto.timingSafeEqual` (Node) or `hmac.compare_digest` (Python) for
  signature comparison. Plain `==` / `===` against an HMAC string leaks
  timing information and is exploitable on a fast network.

  Fix: compare the base64-encoded HMAC against the X-Shopify-Hmac-Sha256
  header via `crypto.timingSafeEqual(Buffer.from(expected, 'base64'),
  Buffer.from(provided, 'base64'))` in Node, or `hmac.compare_digest(expected,
  provided)` in Python.
matcher: null
predicate: shopify-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://shopify.dev/docs/apps/webhooks/configuration/https#step-5-verify-the-webhook
references:
  - https://codahale.com/a-lesson-in-timing-attacks/
  - https://cwe.mitre.org/data/definitions/208.html
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
