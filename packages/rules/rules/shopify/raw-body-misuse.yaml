schema_version: 1
rule_id: shopify/raw-body-misuse
provider: shopify
severity: critical
emits_state: not-verified
message: |
  Shopify webhook handler reads the X-Shopify-Hmac-Sha256 header (or calls
  `shopify.webhooks.validate`) but does not appear to receive the request body
  as raw bytes. Shopify's HMAC is computed over the raw payload — once
  `express.json()` (or any other JSON middleware) parses the body, the bytes
  used for the HMAC differ from what was sent and verification fails on every
  webhook.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  webhook route only, and call `crypto.createHmac('sha256', ...).update(req.body)`
  with the Buffer. Do NOT register `express.json()` globally before the
  webhook route.
matcher: null
predicate: shopify-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://shopify.dev/docs/apps/webhooks/configuration/https#step-5-verify-the-webhook
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
