message: |
  Library-based verification detected: `shopify.webhooks.validate` (Node SDK
  `@shopify/shopify-api`) or `verifyHmac` is reachable from this handler
  within 3 hops. The Shopify SDK enforces HMAC-SHA256 over the raw body and
  base64 comparison internally.
