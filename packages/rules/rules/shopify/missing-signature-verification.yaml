schema_version: 1
rule_id: shopify/missing-signature-verification
provider: shopify
severity: critical
emits_state: not-verified
message: |
  Shopify webhook handler does not appear to verify the X-Shopify-Hmac-Sha256
  header before processing the event. Neither `shopify.webhooks.validate`
  (Node SDK) nor `verifyHmac` is reachable from this handler within 3 hops,
  and no manual HMAC path was detected.

  Shopify docs: "Verify the request is from Shopify by computing an HMAC-SHA256
  digest of the request body and comparing it to the value provided in the
  X-Shopify-Hmac-Sha256 header."

  Fix: compute `crypto.createHmac('sha256', process.env.SHOPIFY_API_SECRET)
  .update(rawBody).digest('base64')` and compare to the header using
  `crypto.timingSafeEqual` (Node), or use the official `@shopify/shopify-api`
  `shopify.webhooks.validate(...)` helper.
matcher: null
predicate: shopify-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://shopify.dev/docs/apps/webhooks/configuration/https#step-5-verify-the-webhook
