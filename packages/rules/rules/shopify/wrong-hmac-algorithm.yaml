schema_version: 1
rule_id: shopify/wrong-hmac-algorithm
provider: shopify
severity: critical
emits_state: not-verified
message: |
  Shopify webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. Shopify signs webhook payloads with
  HMAC-SHA256 — any other algorithm (MD5, SHA-1, SHA-384, SHA-512,
  RIPEMD-160) will never match, so verification cannot succeed.

  Fix: `crypto.createHmac('sha256', secret)` (Node) or
  `hmac.new(secret, msg, hashlib.sha256)` (Python).
matcher: null
predicate: shopify-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
provider_docs_url: https://shopify.dev/docs/apps/webhooks/configuration/https#step-5-verify-the-webhook
