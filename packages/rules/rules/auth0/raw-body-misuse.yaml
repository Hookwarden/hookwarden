schema_version: 1
rule_id: auth0/raw-body-misuse
provider: auth0
severity: critical
emits_state: not-verified
message: |
  Auth0 Log Streams webhook handler reads the `Auth0-Signature` header (or
  computes manual HMAC) but does not appear to receive the request body as
  raw bytes. Auth0's HMAC is computed over the raw payload — once
  `express.json()` (or any other JSON middleware) parses the body, the
  bytes used for the HMAC differ from what was sent and verification fails
  on every log-stream batch.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  Auth0 webhook route only, or capture the raw body via a custom `verify`
  callback before JSON parsing. PHP: read `php://input` before any
  framework body parsing.
matcher: null
predicate: auth0-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://auth0.com/docs/customize/log-streams/event-filtering
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
