schema_version: 1
rule_id: auth0/timing-unsafe-comparison
provider: auth0
severity: critical
emits_state: not-verified
message: |
  Auth0 Log Streams webhook handler computes HMAC-SHA256 manually but does
  not call `crypto.timingSafeEqual` (Node), `hmac.compare_digest` (Python),
  or `hash_equals` (PHP) for the base64 signature comparison. Plain `==` /
  `===` against the base64 HMAC string leaks timing information that lets
  an attacker bisect the signature byte-by-byte over many requests.

  Fix: compare via
  `crypto.timingSafeEqual(Buffer.from(expected, 'base64'), Buffer.from(provided, 'base64'))`
  in Node, `hmac.compare_digest(expected, provided)` in Python, or
  `hash_equals($expected, $provided)` in PHP.
matcher: null
predicate: auth0-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://auth0.com/docs/customize/log-streams/event-filtering
references:
  - https://codahale.com/a-lesson-in-timing-attacks/
  - https://cwe.mitre.org/data/definitions/208.html
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
