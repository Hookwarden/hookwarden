schema_version: 1
rule_id: auth0/missing-signature-verification
provider: auth0
severity: critical
emits_state: not-verified
message: |
  Auth0 Log Streams webhook handler does not appear to verify the
  `Auth0-Signature` header before processing the request. Auth0 does not
  ship a first-party webhook-verification SDK — verification is documented
  as inline HMAC-SHA256 over the raw request body, base64-encoded, compared
  with `crypto.timingSafeEqual`. No such verification path was detected
  reachable from this handler.

  Fix: compute `crypto.createHmac('sha256', signingSecret).update(rawBody).digest('base64')`
  (Node) or `base64.b64encode(hmac.new(secret.encode(), raw_body, hashlib.sha256).digest())`
  (Python) or `base64_encode(hash_hmac('sha256', $rawBody, $secret, true))` (PHP),
  then constant-time-compare against `Auth0-Signature`.
matcher: null
predicate: auth0-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://auth0.com/docs/customize/log-streams/event-filtering
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
