schema_version: 1
rule_id: standardwebhooks/missing-signature-verification
provider: standardwebhooks
severity: critical
emits_state: not-verified
message: |
  Standard Webhooks handler does not verify the `webhook-signature` header before
  processing the request. This fires on two shapes:

  1. No verification is reachable at all — neither the `standardwebhooks` library's
     `Webhook.verify()` (npm / PyPI / Packagist) nor a manual HMAC entry-point is
     reachable from this handler within 3 hops.
  2. Hand-rolled spec re-implementation with the comparison missing — the Clerk
     CVE-2025-53548 shape. The handler computes an HMAC-SHA256 over the canonical
     `{msg_id}.{timestamp}.{body}` string but never compares the result against the
     `webhook-signature` value, so every forged request is accepted. (When a comparison
     IS reachable this rule defers — timing-unsafe-comparison / missing-timestamp-check
     grade it; when only an undecidable local wrapper is reachable the finding is
     downgraded to manual-review.)

  Fix: import and use the canonical library —
  `import { Webhook } from 'standardwebhooks'; new Webhook(secret).verify(rawBody, headers)`
  (Node), `from standardwebhooks import Webhook; Webhook(secret).verify(raw_body, headers)`
  (Python), or `\StandardWebhooks\Webhook($secret)->verify($payload, $headers)` (PHP).
  The library enforces canonical-string construction, base64 HMAC-SHA256, the 5-minute
  timestamp tolerance, and multi-signature parsing during rotation.
matcher: null
predicate: standardwebhooks-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.standardwebhooks.com/
references:
