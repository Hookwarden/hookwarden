schema_version: 1
rule_id: standardwebhooks/missing-signature-verification
provider: standardwebhooks
severity: critical
emits_state: not-verified
message: |
  Standard Webhooks handler does not appear to verify the `webhook-signature`
  header before processing the request. Neither the `standardwebhooks` library's
  `Webhook.verify()` (npm / PyPI / Packagist) nor a manual HMAC entry-point is
  reachable from this handler within 3 hops.

  Fix: import and use the canonical library —
  `import { Webhook } from 'standardwebhooks'; new Webhook(secret).verify(rawBody, headers)`
  (Node), `from standardwebhooks import Webhook; Webhook(secret).verify(raw_body, headers)`
  (Python), or `\StandardWebhooks\Webhook($secret)->verify($payload, $headers)` (PHP).
  The library enforces canonical-string construction, base64 HMAC-SHA256, the 5-minute
  timestamp tolerance, and multi-signature parsing during rotation.
matcher: null
predicate: standardwebhooks-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.standardwebhooks.com/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
