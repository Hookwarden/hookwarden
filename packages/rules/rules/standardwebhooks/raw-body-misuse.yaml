schema_version: 1
rule_id: standardwebhooks/raw-body-misuse
provider: standardwebhooks
severity: critical
emits_state: not-verified
message: |
  Standard Webhooks-shaped handler reads the `webhook-signature` header but
  does not appear to receive the request body as raw bytes. The canonical
  string is `${webhook-id}.${webhook-timestamp}.${rawBody}` — once
  `express.json()` (or any other JSON middleware) parses the body, the bytes
  used for the HMAC differ from what was sent and verification fails on every
  webhook delivery.

  Fix (Express): apply `express.raw({ type: 'application/json' })` to the
  webhook route before any JSON middleware, OR use the `standardwebhooks`
  library which expects raw bytes natively. PHP: read `php://input` before
  any framework body parsing.
matcher: null
predicate: standardwebhooks-raw-body-misuse
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.standardwebhooks.com/
fix:
  safety: safe
  description: "Read the raw request body (req.rawBody in Express; php://input in PHP) instead of the parsed body"
  codegen: dispatch-replace-raw-body-misuse
