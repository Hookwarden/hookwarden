schema_version: 1
rule_id: standardwebhooks/missing-timestamp-check
provider: standardwebhooks
severity: high
emits_state: manual-review
message: |
  Standard Webhooks-shaped handler computes HMAC manually but no timestamp
  tolerance check is reachable from the handler. The spec signs
  `${webhook-id}.${webhook-timestamp}.${rawBody}` — without rejecting
  deliveries whose `webhook-timestamp` is outside the 5-minute spec window,
  an attacker who captures one signed webhook can replay it indefinitely.

  Fix: read `webhook-timestamp`, parse to integer, reject any request where
  `Math.abs(Date.now() / 1000 - ts) > 300` (Node) or
  `abs(time.time() - int(ts)) > 60 * 5` (Python). The `standardwebhooks`
  library enforces the spec tolerance internally.
matcher: null
predicate: standardwebhooks-missing-timestamp-check
applies_to:
