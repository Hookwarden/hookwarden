schema_version: 1
rule_id: standardwebhooks/timing-unsafe-comparison
provider: standardwebhooks
severity: critical
emits_state: not-verified
message: |
  Standard Webhooks-shaped handler computes an HMAC-SHA256 manually but does
  not call `crypto.timingSafeEqual` (Node), `hmac.compare_digest` (Python),
  or `hash_equals` (PHP) for the base64 signature comparison. Plain `==`/`===`
  against the base64 HMAC string leaks timing information.

  Fix: switch to the `standardwebhooks` library (npm / PyPI / Packagist) which
  enforces constant-time comparison internally, or compare via
  `crypto.timingSafeEqual(Buffer.from(expected, 'base64'), Buffer.from(provided, 'base64'))`
  in Node, `hmac.compare_digest(expected, provided)` in Python, or
  `hash_equals($expected, $provided)` in PHP.
matcher: null
predicate: standardwebhooks-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.standardwebhooks.com/
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
