schema_version: 1
rule_id: standardwebhooks/library-verified
provider: standardwebhooks
severity: info
emits_state: verified
message: |
  Library-based verification detected: a `Webhook.verify()` call from the
  `standardwebhooks` library (npm `standardwebhooks`, PyPI `standardwebhooks`,
  Packagist `standard-webhooks/php`) is reachable from this handler within
  3 hops. The library enforces the canonical-string construction
  `${webhook-id}.${webhook-timestamp}.${rawBody}`, HMAC-SHA256 + base64,
  the 5-minute timestamp tolerance, multi-signature `v1,…` parsing during
  rotation, and constant-time comparison.

  This positive short-circuit covers every Standard Webhooks-conformant
  provider — Clerk, Resend, Lob, Mux, Knock, Brex, ChannelTalk, Liveblocks,
  Sumsub — without a per-provider catalog entry.
matcher: null
predicate: standardwebhooks-library-verified
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
  # Phase 27 (RULES-GO-01): Go frameworks — a Svix/Standard-Webhooks Go handler (wh.Verify,
  # carrying sdk_verify_call evidence from the import-gated Go overlay) emits the verified state.
  - net-http-go
  - chi
  - gin
  - echo
