schema_version: 1
rule_id: standardwebhooks/wrong-hmac-algorithm
provider: standardwebhooks
severity: critical
emits_state: not-verified
message: |
  Standard Webhooks-shaped handler uses a manual HMAC path but the algorithm
  in use appears to be other than HMAC-SHA256. The spec mandates HMAC-SHA256
  with base64 encoding (the `v1,` prefix denotes spec version, not algorithm)
  — any other algorithm (MD5, SHA-1, SHA-384, SHA-512) will never match.

  Fix: `crypto.createHmac('sha256', secret)` (Node), `hmac.new(secret.encode(),
  msg, hashlib.sha256)` (Python), or `hash_hmac('sha256', $msg, $secret, true)`
  (PHP — binary output flag required before base64-encoding). Or swap to the
  `standardwebhooks` library.
matcher: null
predicate: standardwebhooks-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://www.standardwebhooks.com/
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
