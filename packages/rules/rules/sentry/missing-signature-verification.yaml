schema_version: 1
rule_id: sentry/missing-signature-verification
provider: sentry
severity: critical
emits_state: not-verified
message: |
  Sentry Integration Platform webhook handler does not appear to verify the
  `Sentry-Hook-Signature` header before processing the request. Sentry has
  no canonical first-party webhook SDK — verification is documented as
  inline HMAC-SHA256 over the raw request body, hex-encoded, compared with
  `crypto.timingSafeEqual`. No such verification path was detected reachable
  from this handler.

  Fix: compute `crypto.createHmac('sha256', clientSecret).update(rawBody).digest('hex')`
  (Node) or `hmac.new(client_secret.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python — Sentry's documented sample) or `hash_hmac('sha256', $rawBody, $secret)`
  (PHP), then constant-time-compare against `Sentry-Hook-Signature`.
matcher: null
predicate: sentry-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.sentry.io/product/integrations/integration-platform/webhooks/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
