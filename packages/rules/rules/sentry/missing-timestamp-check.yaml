schema_version: 1
rule_id: sentry/missing-timestamp-check
provider: sentry
severity: high
emits_state: manual-review
message: |
  Sentry Integration Platform webhook handler computes HMAC manually but no
  timestamp tolerance check is reachable from the handler. Sentry sends a
  dedicated `Sentry-Hook-Timestamp` header on every delivery — without
  rejecting deliveries whose timestamp is outside a tolerance window
  (~5 minutes is conventional), an attacker who captures one signed
  webhook can replay it indefinitely.

  Recommended: read `Sentry-Hook-Timestamp`, parse to integer, and reject
  any request where `Math.abs(Date.now() / 1000 - ts) > 300` (Node) or
  `abs(time.time() - int(ts)) > 60 * 5` (Python). The
  `Sentry-Hook-Resource` header carries the event type for routing — do NOT
  use it for replay defense.
matcher: null
predicate: sentry-missing-timestamp-check
