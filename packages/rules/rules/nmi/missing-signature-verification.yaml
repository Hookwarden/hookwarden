schema_version: 1
rule_id: nmi/missing-signature-verification
provider: nmi
severity: critical
emits_state: not-verified
message: |
  NMI webhook handler does not appear to verify the `Webhook-Signature`
  header before processing the request. NMI signs every webhook with
  HMAC-SHA256 (lowercase hex) over `<nonce>.<raw body>`, where the header has
  the form `t=<nonce>,s=<signature>` and the key is the signing key from the
  merchant control panel. NMI ships no webhook SDK, so verification must be
  hand-rolled. No such verification path was detected reachable from this
  handler — anyone who knows the URL can POST a forged payment event.

  Fix: parse `t` and `s` from `Webhook-Signature`, compute
  `crypto.createHmac('sha256', signingKey).update(nonce + '.' + rawBody).digest('hex')`
  (Node), `hmac.new(signing_key.encode(), f"{nonce}.".encode() + raw_body, hashlib.sha256).hexdigest()`
  (Python), or `hash_hmac("sha256", $nonce . "." . $rawBody, $signingKey)` (PHP), then
  constant-time-compare the result against `s`.
matcher: null
predicate: nmi-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.nmi.com/reference/overview
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
