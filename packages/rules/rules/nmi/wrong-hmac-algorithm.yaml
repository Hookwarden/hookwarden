schema_version: 1
rule_id: nmi/wrong-hmac-algorithm
provider: nmi
severity: high
emits_state: not-verified
message: |
  NMI webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. NMI signs `<nonce>.<raw body>` with
  HMAC-SHA256 and lowercase hex encoding; any other digest will never match
  the `s=` value in `Webhook-Signature`, so the handler either rejects every
  real webhook or the check has been bypassed.

  Fix: `crypto.createHmac('sha256', signingKey)` (Node),
  `hmac.new(signing_key.encode(), msg, hashlib.sha256)` (Python), or
  `hash_hmac("sha256", $nonce . "." . $rawBody, $signingKey)` (PHP).
matcher: null
predicate: nmi-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.nmi.com/reference/overview
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
