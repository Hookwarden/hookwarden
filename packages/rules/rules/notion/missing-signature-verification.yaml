schema_version: 1
rule_id: notion/missing-signature-verification
provider: notion
severity: critical
emits_state: not-verified
message: |
  Notion webhook handler does not appear to verify the `X-Notion-Signature`
  header before processing the request. Notion's webhook integration uses
  a two-phase auth model: an initial `verification_token` echo on setup
  followed by HMAC-SHA256 signed payloads on every runtime event. No
  verification path (header read OR manual HMAC) was detected reachable
  from this handler — the runtime payloads are accepted unauthenticated.

  Fix: read `X-Notion-Signature` (hex), then constant-time-compare against
  `crypto.createHmac('sha256', signingSecret).update(rawBody).digest('hex')`
  (Node) or `hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python) or `hash_hmac('sha256', $rawBody, $secret)` (PHP).
matcher: null
predicate: notion-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.notion.com/reference/webhooks
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
