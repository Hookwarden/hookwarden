schema_version: 1
rule_id: notion/missing-signature-verification
provider: notion
severity: critical
emits_state: not-verified
message: |
  Notion webhook handler does not appear to verify the `X-Notion-Signature`
  header before processing the request. Notion's webhook integration uses
  a two-phase auth model: an initial `verification_token` echo on setup
  followed by HMAC-SHA256 signed payloads on every runtime event. No
  verification path (header read OR manual HMAC) was detected reachable
  from this handler — the runtime payloads are accepted unauthenticated.

  Fix: read `X-Notion-Signature` — the value is `sha256=<hex>`, so STRIP
  the `sha256=` prefix before comparing. Compute
  `crypto.createHmac('sha256', verificationToken).update(rawBody).digest('hex')`
  (Node) or `hmac.new(verification_token.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python) or `hash_hmac('sha256', $rawBody, $secret)` (PHP), then
  constant-time-compare against the hex portion of `X-Notion-Signature`.
  The signing key is the `verification_token` returned during the initial
  endpoint validation handshake — NOT a separately-configured secret.
matcher: null
predicate: notion-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.notion.com/reference/webhooks
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
