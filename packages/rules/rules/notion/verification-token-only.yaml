schema_version: 1
rule_id: notion/verification-token-only
provider: notion
severity: critical
emits_state: manual-review
message: |
  Notion's webhook integration uses a two-phase auth model:
    1. Initial verification: Notion sends a `verification_token` in the
       first delivery; the handler echoes it back to prove ownership.
    2. Runtime events: every subsequent payload is HMAC-SHA256 signed under
       `X-Notion-Signature` — the handler MUST verify the signature.

  This handler reads `X-Notion-Signature` (the signature header is present)
  but no manual HMAC computation (`crypto.createHmac`, `hmac.new`,
  `hash_hmac`) is reachable from the handler entry. The most likely failure
  modes are:
    - The handler is comparing the signature header against a stored
      verification token from setup — that token is NOT the signature.
    - The handler trusts any well-formed `X-Notion-Signature` value without
      actually computing and comparing the HMAC.

  Either way, runtime events are accepted unauthenticated even though the
  handler appears to be checking something.

  Fix: compute
  `crypto.createHmac('sha256', signingSecret).update(rawBody).digest('hex')`
  (or the Python/PHP equivalents) on every runtime event, then constant-time
  compare against `X-Notion-Signature`. The `verification_token` from setup
  is for the initial challenge ONLY — do not reuse it as the signing secret.
matcher: null
predicate: notion-verification-token-only
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.notion.com/reference/webhooks
fix:
  safety: manual-only
  description: "Compute HMAC-SHA256 over the raw body with the signing secret and constant-time compare against X-Notion-Signature"
  codegen: null
