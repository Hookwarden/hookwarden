schema_version: 1
rule_id: discord/library-verified
provider: discord
severity: info
emits_state: verified
message: |
  Ed25519 verification detected for this Discord interactions handler. One of
  `verifyKey` (discord-interactions-js), `nacl.sign.detached.verify` (tweetnacl),
  `nacl.signing.VerifyKey(...).verify(...)` (PyNaCl), or
  `sodium_crypto_sign_verify_detached` (PHP libsodium) is reachable. Discord signs
  `X-Signature-Ed25519` over `timestamp + rawBody`, verified against the app's
  PUBLIC key (hex) — an asymmetric scheme, not a shared HMAC secret.
matcher: null
predicate: discord-library-verified
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://discord.com/developers/docs/events/webhook-events
references:
