schema_version: 1
rule_id: discord/missing-signature-verification
provider: discord
severity: critical
emits_state: not-verified
message: |
  Discord interactions handler does not appear to verify the
  `X-Signature-Ed25519` header before processing the request. Discord signs
  every interaction with Ed25519 over `X-Signature-Timestamp + rawBody`,
  verified against the application's PUBLIC key — and actively probes endpoints
  with invalid signatures, disabling those that respond 2xx. An unverified
  handler accepts forged interactions.

  Fix: verify before acting on the body. JS/TS: `verifyKey(rawBody, signature,
  timestamp, DISCORD_PUBLIC_KEY)` from `discord-interactions-js` (or
  `nacl.sign.detached.verify`). Python: `nacl.signing.VerifyKey(bytes.fromhex(
  PUBLIC_KEY)).verify(...)`. PHP: `sodium_crypto_sign_verify_detached(...)`.
  Reject with 401 on failure.
matcher: null
predicate: discord-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://discord.com/developers/docs/events/webhook-events
references:
  - https://discord.com/developers/docs/interactions/overview#setting-up-an-endpoint-validating-security-request-headers
  - https://github.com/discord/discord-interactions-js
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Verify the Ed25519 signature (verifyKey / nacl / sodium) before acting on the body — see provider_docs_url"
  codegen: null
