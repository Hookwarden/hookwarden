schema_version: 1
rule_id: mailchimp/unreachable-verification
provider: mailchimp
severity: high
emits_state: manual-review
message: |
  Mailchimp webhook handler imports the Mailchimp Marketing SDK or a
  crypto module (`node:crypto`, `hashlib`/`hmac`, `hash_hmac`) but no
  verification path is reachable from the handler entry within 3 hops.
  The verification may be conditional, dynamically dispatched, or in
  dead code — static analysis cannot determine whether every request
  goes through it.

  Recommended: review the handler's call graph manually and confirm
  the verification path is always taken.
matcher: null
