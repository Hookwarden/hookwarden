schema_version: 1
rule_id: mailchimp/url-secret-in-path
provider: mailchimp
severity: high
emits_state: manual-review
message: |
  Mailchimp webhook handler authenticates via a URL-secret-in-path
  (the route includes a secret-shaped path parameter like `:secret`,
  `<token>`, or `{secret}`). This is Mailchimp's historically-documented
  default model and is functional, but it ships with two known issues:

  1. The secret is logged everywhere the URL is logged — proxy access
     logs, CDN logs, browser referer headers (if a Mailchimp landing
     page links to the same domain), analytics tooling.
  2. Where Mailchimp offers a modern HMAC signing option, layering HMAC
     verification on top closes the URL-as-secret leakage surface.

  Recommended: (a) verify the URL-secret path parameter via
  `crypto.timingSafeEqual` (Node) / `hmac.compare_digest` (Python) /
  `hash_equals` (PHP) — never plain `==` — and (b) where the modern
  HMAC option is enabled for your Mailchimp account, additionally
  verify the HMAC header.
matcher: null
predicate: mailchimp-url-secret-in-path
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://mailchimp.com/developer/marketing/guides/sync-audience-data-webhooks/
references:
