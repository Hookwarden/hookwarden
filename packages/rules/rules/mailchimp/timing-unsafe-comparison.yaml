schema_version: 1
rule_id: mailchimp/timing-unsafe-comparison
provider: mailchimp
severity: critical
emits_state: not-verified
message: |
  Mailchimp webhook handler compares either the URL-secret path parameter
  or a manual HMAC against an expected value without using a constant-time
  comparison function. Plain `==` / `===` against a secret leaks timing
  information that lets an attacker bisect the secret byte-by-byte over
  many requests.

  Fix: compare via `crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(provided))`
  in Node, `hmac.compare_digest(expected, provided)` in Python, or
  `hash_equals($expected, $provided)` in PHP.
matcher: null
predicate: mailchimp-timing-unsafe-comparison
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://mailchimp.com/developer/marketing/guides/sync-audience-data-webhooks/
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual / hmac.compare_digest / hash_equals)"
  codegen: dispatch-timing-unsafe-comparison
