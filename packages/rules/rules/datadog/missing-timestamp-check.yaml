schema_version: 1
rule_id: datadog/missing-timestamp-check
provider: datadog
severity: high
emits_state: manual-review
message: |
  Datadog webhook handler computes HMAC manually but no timestamp or
  delivery-ID dedup check is reachable from the handler. Datadog does
  not send a dedicated timestamp header in its webhook integration —
  applications must dedupe by a delivery identifier in the payload to
  avoid indefinite replays of a captured signed delivery.

  Recommended: extract a delivery identifier from the request body
  (e.g. the webhook event `id` / `event_id`), persist it (e.g. Redis
  SETNX with a 10-minute TTL), and reject any request whose identifier
  has already been processed.
