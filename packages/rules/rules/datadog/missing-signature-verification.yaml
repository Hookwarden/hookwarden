schema_version: 1
rule_id: datadog/missing-signature-verification
provider: datadog
severity: critical
emits_state: not-verified
message: |
  Datadog webhook handler does not appear to verify the `X-Datadog-Signature`
  header before processing the request. Datadog has no canonical first-party
  webhook SDK — verification is documented as inline HMAC-SHA256 over the
  raw request body, hex-encoded, compared with `crypto.timingSafeEqual`. No
  such verification path was detected reachable from this handler.

  Fix: compute `crypto.createHmac('sha256', signingSecret).update(rawBody).digest('hex')`
  (Node) or `hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()`
  (Python) or `hash_hmac('sha256', $rawBody, $secret)` (PHP), then
  constant-time-compare against `X-Datadog-Signature`.
matcher: null
predicate: datadog-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://docs.datadoghq.com/integrations/webhooks/
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
