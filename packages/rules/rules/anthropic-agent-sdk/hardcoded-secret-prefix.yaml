schema_version: 1
rule_id: anthropic-agent-sdk/hardcoded-secret-prefix
provider: anthropic-agent-sdk
severity: critical
emits_state: not-verified
message: |
  A literal value matching an Anthropic API-key prefix (`sk-ant-`) appears in
  source code. Hardcoded secrets land in git history, build artefacts, and
  Docker images — once committed, they must be rotated.

  Fix: read the credential from an environment variable (`ANTHROPIC_API_KEY`)
  instead of a source-code literal, and rotate the leaked key in the Anthropic
  Console.
matcher:
  name: secretLiteralPrefix
  args:
    prefix: sk-ant-
predicate: null
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://code.claude.com/docs/en/agent-sdk/overview
references:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
path_severity_overrides:
  - patterns:
      - "**/__tests__/**"
      - "**/fixtures/**"
      - "**/examples/**"
      - "**/*.example.*"
      - "**/*.test.{js,ts,py}"
      - "**/*.spec.{js,ts,py}"
    severity: info
fix:
  safety: manual-only
  description: "Read the credential from env (ANTHROPIC_API_KEY) and rotate the leaked key — see provider_docs_url"
  codegen: null
