schema_version: 1
rule_id: anthropic-agent-sdk/secret-in-log-or-error
provider: anthropic-agent-sdk
severity: high
emits_state: not-verified
message: |
  An `@anthropic-ai/claude-agent-sdk` agent callback handler logs or throws an
  error containing the webhook secret / signing key as a value (e.g.
  `console.log(secret)`, `throw new Error(`secret=${secret}`)`). When log
  storage (CloudWatch, Datadog, Sentry) is compromised, every secret in those
  logs goes with it.

  Defensible patterns (silent):
    - `console.log(!!secret)` / `Boolean(secret)` — boolean only
    - `console.log(secret.length)` — length only
    - `createHmac('sha256', secret).digest('hex')` — hashed
    - `secret.slice(0, 4)` (≤8 chars) — manual-review

  Fix: never log or throw the secret value. Log a derived non-reversible signal
  (boolean, length, or hash). Audit existing log destinations and rotate the
  secret if it ever shipped.
matcher: null
predicate: anthropic-agent-sdk-secret-in-log-or-error
applies_to:
  - express
  - hono
  - fastify
  - nextjs
provider_docs_url: https://code.claude.com/docs/en/agent-sdk/custom-tools
references:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: manual-only
  description: "Replace secret-in-log with a derived non-reversible signal (boolean, length, hash); rotate the secret if it ever shipped — see provider_docs_url"
  codegen: null
