schema_version: 1
rule_id: anthropic-agent-sdk/missing-signature-verification
provider: anthropic-agent-sdk
severity: critical
emits_state: not-verified
message: |
  An `@anthropic-ai/claude-agent-sdk` agent callback handler does not appear to
  verify the incoming request before acting on it. No HMAC verification
  (`crypto.createHmac` + `crypto.timingSafeEqual`) or SDK verifier is reachable
  from this handler.

  The Agent SDK ships no first-party webhook-verification primitive — a handler
  that receives an external callback (a `tool()` `args` payload or a
  `PostToolUse` hook `tool_response`) must verify the request integrity in code.

  Fix: compute `crypto.createHmac('sha256', signingSecret).update(rawBody).digest()`
  and constant-time-compare it against the configured signature header with
  `crypto.timingSafeEqual` before processing the callback payload.
matcher: null
predicate: anthropic-agent-sdk-missing-signature-verification
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://code.claude.com/docs/en/agent-sdk/custom-tools
references:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: manual-only
  description: "Verify the request HMAC before processing the callback payload — see provider_docs_url"
  codegen: null
