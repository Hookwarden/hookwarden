schema_version: 1
rule_id: anthropic-agent-sdk/webhook-trigger-no-authentication
provider: anthropic-agent-sdk
severity: critical
emits_state: not-verified
message: |
  An `@anthropic-ai/claude-agent-sdk` agent callback route is exposed without
  any authentication or signature verification reachable from the handler. Any
  party can POST arbitrary JSON to the agent's public callback URL, and every
  downstream tool() / agent invocation acts on that attacker-controlled payload.

  This is the entry point of the Microsoft "prompts become shells" agentic RCE
  surface: an unauthenticated public callback feeding an agent loop.

  Fix: require an authenticated, signature-verified request (HMAC over the raw
  body via `crypto.createHmac` + `crypto.timingSafeEqual`) before the payload
  reaches any tool() handler or agent invocation.
matcher: null
predicate: anthropic-agent-sdk-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
provider_docs_url: https://code.claude.com/docs/en/agent-sdk/overview
references:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: manual-only
  description: "Require a signature-verified request before the payload reaches any tool() handler or agent invocation — see provider_docs_url"
  codegen: null
