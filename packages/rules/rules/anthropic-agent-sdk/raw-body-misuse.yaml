schema_version: 1
rule_id: anthropic-agent-sdk/raw-body-misuse
provider: anthropic-agent-sdk
severity: critical
emits_state: not-verified
message: |
  An `@anthropic-ai/claude-agent-sdk` agent callback handler reads a signature
  header but does not appear to receive the request body as raw bytes. An HMAC
  is computed over the exact bytes sent — once the framework JSON-parses and
  re-serializes the payload, the bytes used for the HMAC differ from what the
  sender signed, so verification silently fails (or is bypassed).

  Fix: verify against the raw request body (the framework's raw-body accessor or
  the `args.raw_body` passed to the tool() handler), not a re-serialized parsed
  object.
matcher: null
predicate: anthropic-agent-sdk-raw-body-misuse
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://code.claude.com/docs/en/agent-sdk/custom-tools
references:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: safe
  description: "Verify against the raw request body instead of a re-serialized parsed object"
  codegen: dispatch-replace-raw-body-misuse
