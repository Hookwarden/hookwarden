schema_version: 1
rule_id: anthropic-agent-sdk/missing-timing-safe-equal
provider: anthropic-agent-sdk
severity: critical
emits_state: not-verified
message: |
  An `@anthropic-ai/claude-agent-sdk` agent callback handler compares the
  request signature or HMAC with a non-constant-time equality (`===`, `==`,
  `!=`, `Buffer.equals` on attacker-influenced input). String/buffer equality
  short-circuits on the first differing byte, leaking timing that can be used to
  forge a valid signature byte-by-byte.

  Fix: compare the computed HMAC against `args.signature` with
  `crypto.timingSafeEqual` (Node) — never `===`.
matcher: null
predicate: anthropic-agent-sdk-timing-safe-equal
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
provider_docs_url: https://code.claude.com/docs/en/agent-sdk/custom-tools
references:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs}"
    severity: info
fix:
  safety: safe
  description: "Replace insecure equality with a constant-time comparison (crypto.timingSafeEqual)"
  codegen: dispatch-timing-unsafe-comparison
