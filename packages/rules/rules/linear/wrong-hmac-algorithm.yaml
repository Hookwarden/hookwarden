schema_version: 1
rule_id: linear/wrong-hmac-algorithm
provider: linear
severity: critical
emits_state: not-verified
message: |
  Linear webhook handler uses a manual HMAC path but the algorithm in use
  appears to be other than HMAC-SHA256. Linear signs requests with
  HMAC-SHA256 and hex encoding — any other algorithm (MD5, SHA-1, SHA-384,
  SHA-512) will never match, so verification cannot succeed.

  Fix: `crypto.createHmac('sha256', signingSecret)` (Node),
  `hmac.new(signing_secret.encode(), raw_body, hashlib.sha256)` (Python),
  or `hash_hmac('sha256', $rawBody, $secret)` (PHP).
matcher: null
predicate: linear-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.linear.app/docs/graphql/webhooks
