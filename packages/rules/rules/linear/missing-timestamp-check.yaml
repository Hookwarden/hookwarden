schema_version: 1
rule_id: linear/missing-timestamp-check
provider: linear
severity: high
emits_state: manual-review
message: |
  Linear webhook handler computes HMAC manually but no timestamp or
  delivery-ID dedup check is reachable from the handler. Linear does not
  send a dedicated timestamp header — applications must dedupe by the
  delivery identifier in the payload to avoid indefinite replays of a
  captured signed delivery.

  Recommended: extract a delivery identifier from the request body (e.g.
  the webhook `webhookId` + `createdAt` tuple), persist it (e.g. Redis
  SETNX with a 10-minute TTL), and reject any request whose identifier
  has already been processed.
matcher: null
predicate: linear-missing-timestamp-check
applies_to:
  - express
  - hono
  - cloudflare-workers
  - vercel-edge
  - deno
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.linear.app/docs/graphql/webhooks
references:
  - https://docs.stripe.com/webhooks#replay-attacks
  - https://www.standardwebhooks.com/
compliance_mappings:
  soc2_cc: ["CC6.7", "CC7.1"]
  iso27001: ["A.8.24"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE"]
path_severity_overrides:
