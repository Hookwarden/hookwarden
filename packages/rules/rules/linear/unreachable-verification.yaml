schema_version: 1
rule_id: linear/unreachable-verification
provider: linear
severity: high
emits_state: manual-review
message: |
  Linear webhook handler imports a crypto module (`node:crypto`,
  `hashlib`/`hmac`, `hash_hmac`) but the manual HMAC verification path is
  not reachable from the handler entry within 3 hops. The verification
  may be conditional, dynamically dispatched, or in dead code — static
  analysis cannot determine whether every request goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken.
