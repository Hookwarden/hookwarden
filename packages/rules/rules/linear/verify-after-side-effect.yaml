schema_version: 1
rule_id: linear/verify-after-side-effect
provider: linear
severity: high
emits_state: manual-review
message: |
  Linear webhook handler appears to perform a side effect (DB write,
  outbound HTTP call, or event emission) BEFORE verifying the signature. If
  an attacker forges a payload, the side effect fires before the verification
  call can reject the request. The signature check still fails, but the
  damage is already done.

  At v0.7.0 this rule ships at `manual-review` verdict — the engine reports
  what it observed, but the auditor must confirm the call order isn't sound
  for another reason (e.g. middleware-upstream verification, transactional
  rollback on failure, or an asynchronous side effect that completes only
  after verification).

  Fix: move every side effect AFTER the verification call succeeds. Cache
  the verified payload on the request object before writing to the database,
  calling external services, or emitting events.
matcher: null
predicate: linear-verify-after-side-effect
applies_to:
  - express
  - hono
  - fastify
  - nextjs
provider_docs_url: https://developers.linear.app/docs/graphql/webhooks
references:
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
compliance_mappings:
  soc2_cc: ["CC6.1", "CC7.1", "CC7.2"]
  iso27001: ["A.8.24", "A.8.16"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Re-order the handler so every side effect runs AFTER verification succeeds — see provider_docs_url"
  codegen: null
