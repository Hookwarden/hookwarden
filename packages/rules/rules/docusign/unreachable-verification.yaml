schema_version: 1
rule_id: docusign/unreachable-verification
provider: docusign
severity: high
emits_state: manual-review
message: |
  DocuSign Connect webhook handler imports a crypto module (`node:crypto`,
  `hashlib`/`hmac`, `hash_hmac`) but the manual HMAC verification path is
  not reachable from the handler entry within 3 hops. The verification may
  be conditional, dynamically dispatched, or in dead code — static analysis
  cannot determine whether every envelope event goes through it.

  Recommended: review the handler's call graph manually and confirm the
  verification path is always taken.
matcher: null
predicate: docusign-unreachable-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.docusign.com/platform/webhooks/connect/hmac/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
