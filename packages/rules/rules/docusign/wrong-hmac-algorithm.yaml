schema_version: 1
rule_id: docusign/wrong-hmac-algorithm
provider: docusign
severity: critical
emits_state: not-verified
message: |
  DocuSign Connect webhook handler uses a manual HMAC path but the algorithm
  in use appears to be other than HMAC-SHA256. DocuSign Connect signs
  requests with HMAC-SHA256 and base64 encoding — any other algorithm
  (MD5, SHA-1, SHA-384, SHA-512) will never match, so verification cannot
  succeed.

  Fix: `crypto.createHmac('sha256', hmacKey)` (Node),
  `hmac.new(hmac_key.encode(), raw_body, hashlib.sha256)` (Python), or
  `hash_hmac('sha256', $rawBody, $secret, true)` (PHP — note the binary-output
  flag is required before base64-encoding).
matcher: null
predicate: docusign-wrong-hmac-algorithm
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.docusign.com/platform/webhooks/connect/hmac/
references:
  - https://datatracker.ietf.org/doc/html/rfc2104
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
