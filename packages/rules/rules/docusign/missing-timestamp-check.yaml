schema_version: 1
rule_id: docusign/missing-timestamp-check
provider: docusign
severity: high
emits_state: manual-review
message: |
  DocuSign Connect webhook handler computes HMAC manually but no timestamp
  tolerance or delivery-ID dedup check is reachable from the handler.
  DocuSign Connect does not send a dedicated timestamp header — applications
  should dedupe by the envelope event identifier in the payload to avoid
  indefinite replays of a captured signed delivery.

  Recommended: extract a unique event identifier from the envelope payload
  (e.g. `envelopeId` + `event` + `lastModified`), persist it (e.g. Redis
  SETNX with a 10-minute TTL), and reject any request whose identifier
  has already been processed.
