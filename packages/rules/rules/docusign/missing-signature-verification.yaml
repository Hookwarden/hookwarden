schema_version: 1
rule_id: docusign/missing-signature-verification
provider: docusign
severity: critical
emits_state: not-verified
message: |
  DocuSign Connect webhook handler does not appear to verify the
  `X-DocuSign-Signature-1` header before processing the request. DocuSign
  Connect does not ship a first-party webhook-verification SDK —
  verification is documented as inline HMAC-SHA256 over the raw request
  body, base64-encoded, compared with `crypto.timingSafeEqual`. No such
  verification path was detected reachable from this handler.

  Fix: compute `crypto.createHmac('sha256', hmacKey).update(rawBody).digest('base64')`
  (Node), `base64.b64encode(hmac.new(secret.encode(), raw_body, hashlib.sha256).digest())`
  (Python), or `base64_encode(hash_hmac('sha256', $rawBody, $secret, true))`
  (PHP), then constant-time-compare against `X-DocuSign-Signature-1`.
matcher: null
predicate: docusign-missing-signature-verification
applies_to:
  - express
  - hono
  - fastify
  - nextjs
  - flask
  - fastapi
  - django
  - laravel
  - symfony
  - slim
  - vanilla-php
provider_docs_url: https://developers.docusign.com/platform/webhooks/connect/hmac/
references:
  - https://www.svix.com/blog/common-failure-modes-for-webhook-signatures/
  - https://hookdeck.com/webhooks/guides/webhook-security-vulnerabilities-guide
compliance_mappings:
  soc2_cc: ["CC6.1", "CC6.7"]
  iso27001: ["A.8.24", "A.5.14"]
  eu_ai_act_annex_iii: ["Art.15"]
  nist_ai_rmf: ["MEASURE", "MANAGE"]
path_severity_overrides:
  - patterns:
      - "**/{test,tests,__tests__,spec,specs}/**"
      - "**/*.{test,spec}.{js,ts,jsx,tsx,mjs,cjs,py,php}"
    severity: info
fix:
  safety: manual-only
  description: "Apply the fix manually per the provider documentation — see provider_docs_url"
  codegen: null
